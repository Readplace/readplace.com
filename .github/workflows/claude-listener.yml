name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Each event type checks only the author_association of the actual triggering user
    # OWNER is included in author_association checks, so no separate owner check is needed
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write # Required by claude-code-action for OIDC authentication
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-278728209435-ap-southeast-2
      PULUMI_CONFIG_PASSPHRASE: ''
      CLAUDE_ARGS: '--model "claude-opus-4-8[1m]" --effort max --dangerously-skip-permissions --allowedTools WebSearch,WebFetch --disallowedTools Monitor,Task,TaskCreate,TaskGet,TaskList,TaskUpdate,TaskOutput,TaskStop --settings /tmp/claude-headless-settings.json'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Check out the PR head for @claude PR comments so the action computes
          # file SHAs against the PR (where added/renamed files exist), not the
          # base branch — avoids the git hash-object -> ajv "dependencies" crash
          # (anthropics/claude-code-action#979, #852) on PRs that add or rename
          # files. Non-PR events fall back to the default ref.
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The pnpm version must come from the checked-out ref's packageManager field and
      # never be pinned here as well. This workflow always runs main's copy of itself but
      # checks out an arbitrary PR head (see the checkout step), so a second pin rejects
      # every branch whose packageManager still names an older pnpm — action-setup fails
      # with ERR_PNPM_BAD_PM_VERSION and skips every later step, including the one that
      # reports back to the PR.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Override the action's bundled CLI (v2.1.76) with a newer native binary. The action
      # stays pinned at v1.0.72 because its newer agent-SDK glue breaks Max-plan OAuth
      # (#1126/#1281); that auth resolves in the child CLI, so upgrading only the binary
      # picks up CLI fixes without reintroducing the auth bug.
      - name: Install pinned Claude Code CLI
        id: install-claude-cli
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.177
          claude_bin="$(command -v claude || true)"
          for c in "$claude_bin" "$HOME/.local/bin/claude" "$HOME/.claude/local/claude" "$HOME/.claude/bin/claude"; do
            if [ -n "$c" ] && [ -x "$c" ]; then claude_bin="$c"; break; fi
          done
          if [ -z "$claude_bin" ] || [ ! -x "$claude_bin" ]; then
            claude_bin="$(find "$HOME" -maxdepth 5 -type f -name claude -perm -u+x 2>/dev/null | head -1)"
          fi
          test -x "$claude_bin"
          "$claude_bin" --version
          echo "claude_bin=$claude_bin" >> "$GITHUB_OUTPUT"

      # Headless single-shot runs never re-invoke the agent when a backgrounded
      # command finishes, so a `pnpm check` started with run_in_background is
      # killed when the turn ends and the fix is never committed. The PreToolUse
      # guard denies background (forcing foreground); run-checked.sh bounds long
      # commands with a hard timeout so a hung shell run cannot stall the turn;
      # and the settings env raises the Bash timeout so a foreground check has
      # room to finish.
      - name: Install headless Bash guard
        run: |
          cat > /tmp/claude-deny-bg.sh <<'HOOK'
          #!/usr/bin/env bash
          run_in_background="$(jq -r '.tool_input.run_in_background // false' 2>/dev/null || echo false)"
          if [ "$run_in_background" = "true" ]; then
            jq -n '{hookSpecificOutput:{hookEventName:"PreToolUse",permissionDecision:"deny",permissionDecisionReason:"Background shell execution is disabled in this headless CI run; a backgrounded command is killed when your turn ends, so the work would be lost. Run it in the FOREGROUND. For a long verification like pnpm check, run it through the watchdog wrapper by passing your full command as a single quoted argument to bash /tmp/run-checked.sh - the wrapper enforces a hard timeout (exit 124 if it hangs) so the command cannot get stuck, then returns its exit code. After it passes, commit and push."}}'
          fi
          HOOK
          chmod +x /tmp/claude-deny-bg.sh
          cat > /tmp/run-checked.sh <<'WRAP'
          #!/usr/bin/env bash
          TIMEOUT="${RUN_CHECKED_TIMEOUT:-23m}"
          echo "[run-checked] running under ${TIMEOUT}: $*"
          timeout --kill-after=30s "${TIMEOUT}" bash -c "$*"
          code=$?
          [ "$code" -eq 124 ] && echo "[run-checked] TIMED OUT after ${TIMEOUT} (exit 124) - the command hung; treat as a failure, do not retry blindly."
          echo "[run-checked] exit=${code}"
          exit "$code"
          WRAP
          chmod +x /tmp/run-checked.sh
          cat > /tmp/claude-headless-settings.json <<'JSON'
          {
            "env": {
              "BASH_DEFAULT_TIMEOUT_MS": "1500000",
              "BASH_MAX_TIMEOUT_MS": "1800000"
            },
            "hooks": {
              "PreToolUse": [
                { "matcher": "Bash", "hooks": [ { "type": "command", "command": "bash /tmp/claude-deny-bg.sh" } ] }
              ]
            }
          }
          JSON

      # The pinned action's bundled agent-SDK crashes at startup with an ajv
      # "dependencies" validation error (anthropics/claude-code-action#852, unfixed;
      # the action is pinned for the Max-plan OAuth fix) when it ingests a PR's
      # accumulated comment data — notably its own "working/finished" tracking
      # comments, each carrying a decorative spinner image. use_sticky_comment keeps
      # the action to a SINGLE tracking comment so images can't pile up run over
      # run. Do NOT retry this step: each attempt is a fresh action invocation that
      # posts its own tracking comment, so retries accelerate the accumulation and
      # never help anyway (the crash is correlated within a job). timeout-minutes is
      # a watchdog so a genuinely stuck run can't hang to the 6h job limit.
      - name: Run Claude Code
        id: claude
        timeout-minutes: 50
        uses: anthropics/claude-code-action@cd77b50d2b0808657f8e6774085c8bf54484351c # v1.0.72 — pinned: newer agent-SDK glue breaks Max-plan OAuth (anthropics/claude-code-action#1126, #1281); the CLI is upgraded separately via path_to_claude_code_executable
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.install-claude-cli.outputs.claude_bin }}
          show_full_output: true
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          claude_args: ${{ env.CLAUDE_ARGS }}

      # A review run's deterministic, unsanitized output — the agent's final message,
      # including the CLAUDE_REVIEW_START block — exists only in execution_file on this
      # runner. claude-PR-code-review-auto-apply.yml owns the review->fix hop but runs as a
      # separate workflow and cannot read this runner's files, so persist execution_file as
      # an artifact for it. The name carries the PR number because the downstream
      # workflow_run event for an issue_comment-triggered run reports the default branch,
      # not the PR. Keyed on the workflow-authored CLAUDE_REVIEW_REQUEST marker OR a
      # reference to the reviewer prompt file: a manual review re-trigger references the
      # prompt but, typed by hand, drops the HTML marker, so keying on either still
      # persists the artifact while staying inert on ci-fix/conflict/ad-hoc @claude runs,
      # which reference different prompt files. The artifact's presence is the review-run
      # signal the auto-fix workflow keys on.
      - name: Save review output for the auto-fix workflow
        if: steps.claude.outcome == 'success' && github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '<!-- CLAUDE_REVIEW_REQUEST -->') || contains(github.event.comment.body, 'claude-PR-code-reviewer.md'))
        uses: actions/upload-artifact@v4
        with:
          name: review-output-${{ github.event.issue.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 1
          if-no-files-found: error

      # Everything this workflow tells a human is carried by the Claude action's own
      # tracking comment, so a failure in any step outside that action reaches the PR as
      # silence — indistinguishable from the bot ignoring the request, and the reason a
      # four-day toolchain outage read as "the automation is dead". Report those here
      # instead. The default token authors the comment as github-actions[bot], whose
      # comments cannot re-trigger this workflow.
      - name: Report a failure the Claude action could not report
        if: failure() && steps.claude.outcome != 'failure'
        uses: actions/github-script@v8
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const MARKER = '<!-- CLAUDE_LISTENER_SETUP_FAILURE -->';
            const DEDUP_WINDOW_MS = 60 * 60 * 1000;

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: attempt } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner, repo,
              run_id: context.runId,
              attempt_number: Number(process.env.RUN_ATTEMPT),
            });
            const failedStep = attempt.jobs
              .flatMap((job) => job.steps ?? [])
              .find((step) => step.conclusion === 'failure');
            const stepName = failedStep?.name ?? 'an unidentified step';
            const claudeOutcome = process.env.CLAUDE_OUTCOME || 'did not run';
            core.warning(`Listener failed at "${stepName}"; Claude step ${claudeOutcome}.`);

            // Paginate rather than reading one page: listComments returns OLDEST first, so
            // a bounded page silently stops covering the newest comments once a PR grows
            // past it — which is how the 1h dedup on this marker would rot. Dedup matters:
            // the crash-retry workflow re-runs a crashed listener, and each failed attempt
            // lands back here.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const recentlyReported = comments.some((c) =>
              c.body.includes(MARKER) &&
              Date.now() - new Date(c.created_at).getTime() < DEDUP_WINDOW_MS);
            if (recentlyReported) {
              core.info('A failure report already exists within the dedup window.');
              return;
            }

            const ranAgent = claudeOutcome === 'success';
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                MARKER,
                '',
                ranAgent
                  ? '### This `@claude` run failed after the agent finished'
                  : '### This `@claude` request was never processed',
                '',
                ranAgent
                  ? `The agent completed, but the run then failed at **\`${stepName}\`**, so anything keyed on the run finishing cleanly — such as the review hand-off — did not happen.`
                  : `The listener run failed at **\`${stepName}\`** — outside the Claude action, so no tracking comment was posted and nothing was applied here.`,
                '',
                `- **Claude step**: ${claudeOutcome}`,
                `- **Run**: ${runUrl}`,
                '',
                'This is a pipeline failure, not a task failure. Fix the run above, then re-request.',
              ].join('\n'),
            });
