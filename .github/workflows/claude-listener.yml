name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Each event type checks only the author_association of the actual triggering user
    # OWNER is included in author_association checks, so no separate owner check is needed
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write # Required by claude-code-action for OIDC authentication
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-278728209435-ap-southeast-2
      PULUMI_CONFIG_PASSPHRASE: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Override the action's bundled CLI (v2.1.76) with a newer native binary. The action
      # stays pinned at v1.0.72 because its newer agent-SDK glue breaks Max-plan OAuth
      # (#1126/#1281); that auth resolves in the child CLI, so upgrading only the binary
      # picks up CLI fixes without reintroducing the auth bug.
      - name: Install pinned Claude Code CLI
        id: install-claude-cli
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.161
          claude_bin="$(command -v claude || true)"
          for c in "$claude_bin" "$HOME/.local/bin/claude" "$HOME/.claude/local/claude" "$HOME/.claude/bin/claude"; do
            if [ -n "$c" ] && [ -x "$c" ]; then claude_bin="$c"; break; fi
          done
          if [ -z "$claude_bin" ] || [ ! -x "$claude_bin" ]; then
            claude_bin="$(find "$HOME" -maxdepth 5 -type f -name claude -perm -u+x 2>/dev/null | head -1)"
          fi
          test -x "$claude_bin"
          "$claude_bin" --version
          echo "claude_bin=$claude_bin" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@cd77b50d2b0808657f8e6774085c8bf54484351c # v1.0.72 — pinned: newer agent-SDK glue breaks Max-plan OAuth (anthropics/claude-code-action#1126, #1281); the CLI is upgraded separately via path_to_claude_code_executable
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.install-claude-cli.outputs.claude_bin }}
          show_full_output: true

          additional_permissions: |
            actions: read

          claude_args: '--model "claude-opus-4-8[1m]" --effort max --dangerously-skip-permissions --allowedTools Task,TaskOutput,TaskStop,WebSearch,WebFetch --append-system-prompt "For substantive, multi-part, or repo-wide tasks: state the full plan up front, then fan out — delegate independent workstreams (multiple files to read, multiple hypotheses, a fix plus its adversarial verification) to subagents via the Task tool instead of working serially. For minor reversible choices, pick a reasonable option and note it rather than asking; only ask for scope changes or destructive actions. Prefer the most thorough, correct outcome over the fastest."'
