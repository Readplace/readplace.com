# Asserts the repo-admin PAT that the self-hosted runner uses to register is not
# reachable from inside a job. Reports presence only — it must never print a token
# value, because this repo is public and its logs are world-readable.
#
# Checks 1-6 verify the PAT stays closed on every direct read path. Check 7 asserts
# the docker socket is NOT mounted: it used to be, so detect-projects could build
# the OCR image, but that socket was a root-equivalent host escape (`docker run -v
# /:/host` reads the PAT off the host fs). check-infra now computes the image tag
# with --tag-only (no docker), the real build+push moved to a github-hosted
# runner, and the socket was removed — so with checks 7 (no socket) and 8 (no
# sudo) both green, there is no known escape to the PAT from a job here.
#
# Check 8 asserts the sudo escalation path stays closed. The base image ships
# `runner` in the sudo group (NOPASSWD:ALL), which would make `sudo cat
# /root/gh-pat.env` recover the PAT and render checks 3/4 decorative; the
# Dockerfile drops that membership, and this check fails loudly if a future base
# image or edit re-grants it. (It can be dropped because the sole sudo consumer,
# the playwright `--with-deps` install, now runs only on github-hosted runners.)
name: Runner Secret Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, orbstack]
    steps:
      - name: Can a job reach the runner's registration PAT?
        run: |
          fail=0
          echo "job user: $(id -un) (uid=$(id -u))"

          echo "--- 1. PAT in the job's own environment?"
          if env | grep -qiE '^(ACCESS_TOKEN|GH_PAT)='; then
            echo "  EXPOSED: named var present in job env"; fail=1
          else
            echo "  ok: not in job env"
          fi

          echo "--- 2. PAT readable via /proc/1/environ?"
          if tr '\0' '\n' < /proc/1/environ 2>/dev/null | grep -qiE '^(ACCESS_TOKEN|GH_PAT)='; then
            echo "  EXPOSED: readable from PID 1 environ"; fail=1
          else
            echo "  ok: not readable from PID 1 environ"
          fi

          echo "--- 3. PAT file readable by the job?"
          if [ -r /run/secrets/gh_pat ] || [ -r /root/gh-pat.env ]; then
            echo "  EXPOSED: a PAT file is job-readable"; fail=1
          else
            echo "  ok: no PAT file readable"
          fi

          echo "--- 4. raw token value reachable anywhere a job can look?"
          if { env; tr '\0' '\n' < /proc/1/environ 2>/dev/null; \
               cat /run/secrets/gh_pat /root/gh-pat.env 2>/dev/null; } \
               | grep -qE 'github_pat_[A-Za-z0-9_]{20,}'; then
            echo "  EXPOSED: raw PAT value reachable"; fail=1
          else
            echo "  ok: no raw PAT value reachable"
          fi

          echo "--- 5. can the job reach the OrbStack host (the Mac)?"
          host=$(getent hosts host.docker.internal | awk '{print $1}')
          if [ -n "$host" ] && timeout 3 bash -c "echo > /dev/tcp/$host/5432" 2>/dev/null; then
            echo "  EXPOSED: host $host:5432 (postgres) reachable from a job"; fail=1
          else
            echo "  ok: OrbStack host not reachable"
          fi

          echo "--- 6. is public internet still reachable? (must stay YES)"
          if timeout 6 curl -fsS -o /dev/null https://api.github.com; then
            echo "  ok: github reachable"
          else
            echo "  BROKEN: github unreachable — egress rule too broad"; fail=1
          fi

          echo "--- 7. is the docker socket mounted? (must NOT be — it is a host-root escape)"
          # The socket used to be mounted for the OCR image build; a job could
          # `docker run -v /:/host` and read the PAT off the host fs regardless of
          # the /root seal. check-infra now computes the tag with --tag-only (no
          # docker), so the socket is gone. A mounted socket here is a regression.
          if [ -S /var/run/docker.sock ]; then
            echo "  EXPOSED: docker socket IS mounted — root-equivalent host escape, reopens the PAT path"; fail=1
          else
            echo "  ok: no docker socket mounted"
          fi

          echo "--- 8. can the job escalate to root with sudo (and read the PAT that way)?"
          # Must stay closed. The base image ships `runner` in the sudo group with
          # NOPASSWD:ALL, so `sudo cat /root/gh-pat.env` would walk straight past the
          # /root seal that checks 3/4 test. The Dockerfile drops that membership; this
          # fails loudly if a base image or edit re-grants it.
          if sudo -n true 2>/dev/null; then
            echo "  EXPOSED: job user has passwordless sudo — 'sudo cat /root/gh-pat.env' recovers the PAT."
            echo "           REGRESSION: the Dockerfile is meant to drop `runner` from the sudo group."
            fail=1
          else
            echo "  ok: no sudo escalation available to the job"
          fi

          echo "--- result"
          if [ "$fail" -eq 0 ]; then echo "PASS: the PAT is closed on every direct path (the check-7 socket escape remains, by design)"; else echo "FAIL: the PAT is reachable from a job"; fi
          exit "$fail"
