name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_SKIP_NX_CACHE: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}

permissions:
  contents: read

jobs:
  # Lint/type/test/coverage suite for every Node project (web app, extensions,
  # packages). The iOS suite cannot live in this job: it needs Xcode on a macOS
  # runner and is path-gated to iOS changes (see ios-tests below).
  web-tests:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && fromJSON('["self-hosted", "ci-runner"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-572337278115-ap-southeast-2
      PULUMI_STACK: staging
      PULUMI_CONFIG_PASSPHRASE: ''
      PERSISTENCE: development
      STATIC_BASE_URL: ''
      # editorconfig-checker fetches its Go binary through api.github.com on
      # first use. Unauthenticated that is 60 req/hr per IP, shared with every
      # other caller behind this runner's NAT — which is what 403s the lint job.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # self-hosted parks the pnpm store on its persistent /persist volume
          # (npm_config_store_dir, set in the runner container); skip GitHub's cache there
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile --reporter=append-only --loglevel=warn

      - name: Install WebKit OS libraries
        if: runner.environment == 'github-hosted'
        working-directory: projects/hutch
        run: node_modules/.bin/playwright install-deps webkit

      # Self-hosted carries the same browsers in its own image, from this same
      # digest, so it needs nothing here.
      - uses: ./.github/actions/pinned-browsers
        if: runner.environment == 'github-hosted'

      # The binary cache lives inside node_modules, which checkout's
      # `git clean -ffdx` wipes each job. Keep a copy on the persistent volume
      # so the runner fetches once per version, not once per job.
      - name: Reuse the persisted editorconfig-checker binary
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          eval "$(grep '^export EDITORCONFIG_CHECKER_VERSION=' .envrc)"
          version="$EDITORCONFIG_CHECKER_VERSION"
          pkg=$(echo node_modules/.pnpm/editorconfig-checker@*/node_modules/editorconfig-checker)
          test -d "$pkg" || { echo "::error::editorconfig-checker not installed at $pkg"; exit 1; }
          store="/persist/editorconfig-checker/$version"
          if [ -d "$store" ]; then
            mkdir -p "$pkg/bin"
            cp -a "$store" "$pkg/bin/$version"
          else
            EC_VERSION="$version" node "$pkg/dist/index.js" --version
            mkdir -p "$(dirname "$store")"
            cp -a "$pkg/bin/$version" "$store"
          fi

      # Runner drift is invisible from test output alone: the 2026-08-09 red
      # streak (Firefox 153's WebDriver allow-list, then geckodriver 0.35.0
      # rejecting --allow-system-access) was only diagnosable by docker-exec'ing
      # into the runner. One log line makes the next drift a 30-second read.
      - name: Show browser toolchain versions
        run: |
          firefox --version 2>/dev/null || echo "firefox: not on PATH"
          geckodriver --version 2>/dev/null | head -1 || echo "geckodriver: not on PATH"

      - name: Run pnpm check --exclude=ios,android
        run: |
          log=$(mktemp)
          pnpm check --exclude=ios,android >"$log" 2>&1 &
          check_pid=$!
          tail --follow --pid="$check_pid" --lines=+1 "$log"
          wait "$check_pid"

      - name: Upload Playwright reports and screenshot galleries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-and-galleries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            projects/hutch/playwright-report
            projects/hutch/test-results/screenshot-gallery
            projects/inbox/playwright-report
            projects/inbox/test-results/screenshot-gallery
          if-no-files-found: error
          retention-days: 30

      - name: Hand the transition frames to the visual review
        if: always() && runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          destination="$CI_ARTIFACT_ROOT/$GITHUB_RUN_ID/frames"
          mkdir -p "$destination"
          for flow in projects/*/test-results/transition-frames/* projects/browser-extensions/*/test-results/transition-frames/*; do
            if [ -d "$flow" ]; then
              cp -R "$flow" "$destination/"
            fi
          done

  # Save-latency gate for both browser extensions: a save must paint the saved
  # view in under the measured budget on average.
  #
  # github-hosted, never the self-hosted runner: these samples are wall clock,
  # and the orbstack box is one machine shared with whatever else is scheduled
  # on it (a prior commit's visual-review runs MLX inference there), which shows
  # up as latency this job would report as a regression. A hosted runner is a
  # dedicated VM. It also removes the Rosetta tax — self-hosted is arm64 and
  # runs Chrome for Testing emulated, so its numbers describe no real user.
  #
  # `needs` is about cost, not isolation: don't spend a hosted runner measuring
  # a commit whose build is already broken.
  perf-tests:
    needs: [web-tests]
    runs-on: ubuntu-latest
    # The suites bound themselves — 60s per UI wait and 5min per test for the
    # single-save ones, 5min and 15min for the bulk ones, 90s for the server,
    # then a hard failsafe each: 8min single-save, 20min bulk. Two paths escape
    # all of that: the extension builds run through spawnSync with no timeout,
    # and the fixture-user POST runs before the failsafe is armed. A job ceiling
    # is the only layer that covers them, and without one a hang holds a runner
    # for the 6h default. Four browser suites all riding their failsafes would
    # be ~56min, plus builds. The browser install used to escape too; it is now
    # a digest-pinned image the pinned-browsers step materialises.
    timeout-minutes: 75
    env:
      STATIC_BASE_URL: ''
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile --reporter=append-only --loglevel=warn

      - uses: ./.github/actions/pinned-browsers

      # Was drift visibility: the hosted-image Firefox bump (152.0.6 -> 153.0.3
      # in image 20260804.265.1) surfaced here first, as an apparent flake,
      # because nothing logged which Firefox the job drew. Now it resolves
      # through PATH, so it proves the step above won over the hosted image's
      # own Firefox rather than merely reporting which one turned up.
      - name: Show browser toolchain versions
        run: |
          firefox --version 2>/dev/null || echo "firefox: not on PATH"
          geckodriver --version 2>/dev/null | head -1 || echo "geckodriver: not on PATH"

      - run: pnpm perf

      # Uploaded on failure too: the distribution is what separates a genuine
      # regression from a runner that was starved.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-latency-${{ github.run_id }}
          path: |
            projects/browser-extensions/*/test-results/perf/*.json
            projects/browser-extensions/*/test-results/perf/*.png
          if-no-files-found: warn

  # Only detect and deploy on pushes to main (not on PRs)
  detect-projects:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Self-hosted for the nx cache: the dependency compile is a hit instead of 77s
    # cold. save-link's check-infra computes the OCR image tag with --tag-only (no
    # docker); the real build+push happens in deploy-infra on a github-hosted
    # runner, so this runner ships no docker and mounts no docker socket. No fork
    # fallback like web-tests needs — the `if:` above already restricts this to
    # main pushes, so only trusted (merged) code ever runs here.
    runs-on: [self-hosted, ci-runner]
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-572337278115-ap-southeast-2
      PULUMI_STACK: staging
      PULUMI_CONFIG_PASSPHRASE: ''
    # Expose detection results so downstream jobs can conditionally run
    outputs:
      platform-affected: ${{ steps.detect.outputs.platform-affected }}
      save-link-affected: ${{ steps.detect.outputs.save-link-affected }}
      matrix-projects-hex: ${{ steps.detect.outputs.matrix-projects-hex }}
      has-matrix-projects: ${{ steps.detect.outputs.has-matrix-projects }}
      ff-affected: ${{ steps.detect.outputs.ff-affected }}
      chrome-affected: ${{ steps.detect.outputs.chrome-affected }}
    steps:
      # check-infra runs `pulumi preview` against each project's Pulumi program,
      # which evaluates top-level `requireEnv` calls (e.g. DEEPSEEK_API_KEY,
      # GOOGLE_LOGIN_CLIENT_ID). Without secrets exported as env vars the program
      # crashes before the resource graph is built and drift detection silently
      # reports "No drift" — matches the secret-export step in
      # project-deployment.yaml.
      - name: Export all repository and environment secrets as env vars
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          DELIM="EOF_$(openssl rand -hex 16)"
          printf '%s' "$SECRETS_JSON" | jq -r --arg d "$DELIM" '
            to_entries[]
            | select(.key != "github_token")
            | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          # Full history needed for nx affected to compare commits
          fetch-depth: 0

      # Sets NX_BASE and NX_HEAD so nx affected knows what commits to compare.
      # The publish workflows tag instead of committing back to main, so there
      # are no bot version-bump commits in the diff and the newest commit with
      # a green push run is the correct anchor.
      - uses: ./.github/actions/affected-base

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # self-hosted keeps the pnpm store on a volume; skip GitHub's cache service there
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile --reporter=append-only --loglevel=warn

      - id: detect
        run: |
          # Get the list of projects affected by the push (uses NX_BASE..NX_HEAD)
          AFFECTED=$(pnpm nx show projects --affected --json)
          echo "Affected projects: $AFFECTED"

          # Dynamically discover all projects that have a "deploy-infra" target
          DEPLOYABLE=$(pnpm nx show projects --with-target deploy-infra --json)

          # Intersect: projects that are both affected AND deployable
          ALREADY_DEPLOY=$(echo "$AFFECTED" "$DEPLOYABLE" | jq -s '.[0] as $a | .[1] | map(select(. as $p | $a | index($p)))')
          echo "Code-affected deployable: $ALREADY_DEPLOY"

          # Deployable projects NOT in the affected list — check for infra drift
          UNCHECKED=$(echo "$DEPLOYABLE" "$ALREADY_DEPLOY" | jq -s '.[0] as $d | .[1] as $a | $d | map(select(. as $p | $a | index($p) | not))')
          echo "Checking infra drift for: $UNCHECKED"

          # Compile dependencies so check-infra can evaluate Pulumi programs
          UNCHECKED_CSV=$(echo "$UNCHECKED" | jq -r 'join(",")')
          if [ -n "$UNCHECKED_CSV" ]; then
            pnpm nx run-many --target=compile --projects="$UNCHECKED_CSV" 2>&1 || true
          fi

          # Run check-infra for each unchecked project to detect drift from pulumi
          # output. A non-zero exit from `nx run check-infra` means the Pulumi
          # program crashed before the resource graph was built (e.g. missing env
          # var), so drift is unknown — force a redeploy rather than silently
          # reporting "no drift".
          #
          # Run them CONCURRENTLY: each is an independent Pulumi project (distinct
          # Pulumi.yaml `name`), so previews never contend on state or locks, and
          # concurrent plugin installs serialize on Pulumi's own per-plugin lock.
          # Capture each project to its own file — both streams, since Pulumi's
          # resource summary and crash traces split across stdout/stderr — plus its
          # exit code, then classify serially after `wait`. This is deliberately
          # NOT `nx run-many`: that collapses to one aggregate exit code and
          # interleaves output, which would destroy the per-project crash-vs-drift
          # decision below.
          DRIFTED='[]'
          tmp=$(mktemp -d)
          declare -A pid_of
          for project in $(echo "$UNCHECKED" | jq -r '.[]'); do
            # `set +e` inside the subshell so a failing check-infra does not abort
            # it before its exit code is recorded (the step runs under `bash -e`).
            ( set +e; pnpm nx run "$project:check-infra" >"$tmp/$project.log" 2>&1; echo $? >"$tmp/$project.exit" ) &
            pid_of[$project]=$!
          done
          for project in $(echo "$UNCHECKED" | jq -r '.[]'); do
            wait "${pid_of[$project]}" || true
            # Missing exit file (job killed) → treat as a crash → forced redeploy.
            INFRA_EXIT=$(cat "$tmp/$project.exit" 2>/dev/null || echo 1)
            echo "::group::check-infra $project"
            cat "$tmp/$project.log" 2>/dev/null || true
            if [ "$INFRA_EXIT" -ne 0 ]; then
              echo "::error::check-infra crashed for $project (exit $INFRA_EXIT) — drift unknown, forcing redeploy"
              DRIFTED=$(echo "$DRIFTED" | jq --arg p "$project" '. + [$p]')
            elif grep -qE 'to (update|create|delete|replace)' "$tmp/$project.log"; then
              echo "Drift detected in: $project"
              DRIFTED=$(echo "$DRIFTED" | jq --arg p "$project" '. + [$p]')
            else
              echo "No drift in: $project"
            fi
            echo "::endgroup::"
          done
          rm -rf "$tmp"
          echo "Drifted projects: $DRIFTED"

          # Final deploy list: code-affected + infra-drifted
          PROJECTS=$(echo "$ALREADY_DEPLOY" "$DRIFTED" | jq -s '.[0] + .[1] | unique')
          MATRIX_PROJECTS=$(echo "$PROJECTS" | jq -c '. - ["platform", "save-link"]')

          echo "Final deploy list: $PROJECTS"
          echo "Deploy matrix after platform and save-link: $MATRIX_PROJECTS"

          # Extension publish gates fire on compile-affected, which does NOT consult
          # compile's ^production inputs -- it is project-graph reachability plus the
          # workspace-global files in nx.json namedInputs.sharedGlobals (.envrc, the
          # Pulumi stack configs, *.config.base.*, pnpm-workspace.yaml), which nx
          # treats as an implicit dependency of EVERY project. So a commit touching
          # only one of those cuts a Chrome Web Store / AMO release containing no
          # extension change. That is accepted: republishing an unchanged extension is
          # harmless, and hashing those files is what keeps a cached green honest.
          COMPILE_AFFECTED=$(pnpm nx show projects --affected --target=compile --json)

          # Set outputs for downstream jobs to use in their `if:` conditions
          {
            echo "platform-affected=$(echo "$PROJECTS" | jq -e 'index("platform")' > /dev/null 2>&1 && echo true || echo false)"
            echo "save-link-affected=$(echo "$PROJECTS" | jq 'index("save-link") != null')"
            echo "matrix-projects-hex=$(printf '%s' "$MATRIX_PROJECTS" | od -An -v -tx1 | tr -d ' \n')"
            echo "has-matrix-projects=$(echo "$MATRIX_PROJECTS" | jq 'length > 0')"
            echo "ff-affected=$(echo "$COMPILE_AFFECTED" | jq -e 'index("firefox-extension")' > /dev/null 2>&1 && echo true || echo false)"
            echo "chrome-affected=$(echo "$COMPILE_AFFECTED" | jq -e 'index("chrome-extension")' > /dev/null 2>&1 && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # Compare shipping paths and the tracked production rollout at the same
  # affected-base revision so retries also pick up an unshipped activation.
  detect-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publishing-enabled: ${{ steps.detect.outputs.publishing-enabled }}
      activating: ${{ steps.detect.outputs.activating }}
      android-affected: ${{ steps.detect.outputs.android-affected }}
      android-test-affected: ${{ steps.detect.outputs.android-test-affected }}
      ios-affected: ${{ steps.detect.outputs.ios-affected }}
      ios-test-affected: ${{ steps.detect.outputs.ios-test-affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for affected-base to resolve the diff base
          fetch-depth: 0

      - uses: ./.github/actions/affected-base

      - id: detect
        run: |
          home_enabled() {
            git show "$1:projects/hutch/Pulumi.prod.yaml" |
              ruby -ryaml -e 'puts YAML.safe_load(STDIN.read).fetch("config").fetch("hutch:handPickedHomeEnabled", false)'
          }
          previous=$(home_enabled "$NX_BASE")
          current=$(home_enabled "$NX_HEAD")
          echo "publishing-enabled=$current" >> "$GITHUB_OUTPUT"
          activating=false
          if [[ "$previous" != true && "$current" == true ]]; then activating=true; fi
          echo "activating=$activating" >> "$GITHUB_OUTPUT"

          # A test-only change exercises the native suite. Shipping code and
          # activation also qualify a build for publication after deployment.
          ios_shipping=(projects/native-apps/ios/{App,Shared,ShareExtension,project.yml})
          android_shipping=(projects/native-apps/android/{app/src/main,app/build.gradle.kts,build.gradle.kts,settings.gradle.kts,gradle})
          changed() {
            local paths
            paths=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- "$@") || return 1
            if [[ -n "$paths" ]]; then echo true; else echo false; fi
          }
          ios=$(changed "${ios_shipping[@]}")
          ios_tests=$(changed "${ios_shipping[@]}" projects/native-apps/ios/Tests)
          android=$(changed "${android_shipping[@]}")
          android_tests=$(changed "${android_shipping[@]}" projects/native-apps/android/app/src/test)
          {
            echo "ios-affected=$ios"
            echo "ios-test-affected=$ios_tests"
            echo "android-affected=$android"
            echo "android-test-affected=$android_tests"
          } >> "$GITHUB_OUTPUT"

  # Platform (EventBridge bus, shared infra) must deploy before any other project
  # because other projects depend on platform resources (e.g. event bus ARN)
  deploy-platform:
    if: needs.detect-projects.outputs.platform-affected == 'true'
    needs: [web-tests, perf-tests, detect-projects]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/project-deployment.yaml
    secrets: inherit
    with:
      project: platform

  # Hutch and Inbox can emit new SubmitLinkCommand fields as soon as they deploy.
  # Finish rolling out the consumer on both stacks before either producer starts.
  deploy-save-link:
    if: >-
      !cancelled()
      && needs.web-tests.result == 'success'
      && needs.perf-tests.result == 'success'
      && needs.detect-projects.result == 'success'
      && needs.detect-projects.outputs.save-link-affected == 'true'
      && (needs.detect-projects.outputs.platform-affected == 'false' || needs.deploy-platform.result == 'success')
    needs: [web-tests, perf-tests, detect-projects, deploy-platform]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/project-deployment.yaml
    secrets: inherit
    with:
      project: save-link

  # detect-projects exports every repository secret (so check-infra can evaluate
  # each Pulumi program), which registers them all as masks in that job. When the
  # affected list is broad enough that a project name shares a substring with a
  # secret value, GitHub refuses to set the raw JSON output ("may contain secret")
  # and the deploy matrix collapses to fromJSON('') — failing the run.
  # detect-projects emits the list hex-encoded (hex holds neither a plaintext nor
  # a base64 secret, so it is never masked); this secret-free job decodes it back
  # to JSON for the matrix.
  resolve-deploy-matrix:
    if: needs.detect-projects.outputs.has-matrix-projects == 'true'
    needs: [detect-projects]
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.decode.outputs.projects }}
    steps:
      - id: decode
        run: |
          DECODED=$(printf '%s' '${{ needs.detect-projects.outputs.matrix-projects-hex }}' \
            | python3 -c 'import sys; sys.stdout.write(bytes.fromhex(sys.stdin.read().strip()).decode())')
          echo "projects=$DECODED" >> "$GITHUB_OUTPUT"

  # Deploy the remaining projects in parallel using a dynamic matrix
  # Each project goes through staging → post-deploy verification → prod
  # via the reusable project-deployment.yaml workflow
  pipeline:
    name: ${{ matrix.project }}
    if: >-
      !cancelled()
      && needs.web-tests.result == 'success'
      && needs.perf-tests.result == 'success'
      && needs.detect-projects.result == 'success'
      && (needs.detect-projects.outputs.platform-affected == 'false' || needs.deploy-platform.result == 'success')
      && (needs.detect-projects.outputs.save-link-affected == 'false' || needs.deploy-save-link.result == 'success')
      && needs.resolve-deploy-matrix.result == 'success'
      && needs.detect-projects.outputs.has-matrix-projects == 'true'
    needs: [web-tests, perf-tests, detect-projects, deploy-platform, deploy-save-link, resolve-deploy-matrix]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.resolve-deploy-matrix.outputs.projects) }}
    uses: ./.github/workflows/project-deployment.yaml
    secrets: inherit
    with:
      project: ${{ matrix.project }}

  # Publish Firefox extension to AMO (runs after pipeline deploys infra)
  # always() disarms the implicit success() guard so a skipped deploy-platform
  # doesn't cascade into skipping this publish; pipeline.result == 'success'
  # keeps it gated on the actual deploy chain.
  ff-extension-publish:
    if: >-
      always()
      && needs.pipeline.result == 'success'
      && needs.detect-clients.outputs.publishing-enabled == 'true'
      && (needs.detect-projects.outputs.ff-affected == 'true' || needs.detect-clients.outputs.activating == 'true')
    needs: [detect-projects, detect-clients, pipeline]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-firefox-extension.yml
    secrets: inherit

  # Publish Chrome extension to Chrome Web Store
  chrome-extension-publish:
    if: >-
      always()
      && needs.pipeline.result == 'success'
      && needs.detect-clients.outputs.publishing-enabled == 'true'
      && (needs.detect-projects.outputs.chrome-affected == 'true' || needs.detect-clients.outputs.activating == 'true')
    needs: [detect-projects, detect-clients, pipeline]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-chrome-extension.yml
    secrets: inherit

  # Android unit tests. Unlike ios-tests these are plain JVM tests — no emulator,
  # no macOS — so they run on the free GitHub-hosted Linux runner for everyone.
  # That also makes the fork-PR split unnecessary: no self-hosted runner is
  # involved, so untrusted PR code has nothing to reach.
  android-tests:
    if: needs.detect-clients.outputs.android-test-affected == 'true' || needs.detect-clients.outputs.activating == 'true'
    needs: [detect-clients]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/native-apps/android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle distribution and dependency graph, and rejects a
      # tampered wrapper jar on a fork PR.
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      # The runner image ships an SDK with licences pre-accepted; pinning the two
      # packages the build needs makes an image drift fail legibly here rather
      # than as an opaque AGP download error mid-build.
      - name: Ensure the SDK platform and build-tools the build pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Run the unit suite, the coverage ratchet, and the staging config pins
        run: make test

  android-play-publish:
    if: >-
      !cancelled()
      && needs.web-tests.result == 'success'
      && needs.perf-tests.result == 'success'
      && needs.android-tests.result == 'success'
      && needs.detect-clients.outputs.publishing-enabled == 'true'
      && (needs.detect-clients.outputs.android-affected == 'true' || needs.detect-clients.outputs.activating == 'true')
      && needs.detect-projects.result == 'success'
      && (needs.detect-projects.outputs.platform-affected == 'false' || needs.deploy-platform.result == 'success')
      && (needs.detect-projects.outputs.save-link-affected == 'false' || needs.deploy-save-link.result == 'success')
      && (needs.detect-projects.outputs.has-matrix-projects == 'false' || needs.pipeline.result == 'success')
    needs: [web-tests, perf-tests, detect-clients, android-tests, detect-projects, deploy-platform, deploy-save-link, pipeline]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-android-play.yml
    secrets: inherit

  # iOS code OR tests change; publish stays scoped to shipping code via
  # ios-affected (⊆ ios-test-affected), so this always runs when publish would.
  ios-tests:
    if: needs.detect-clients.outputs.ios-test-affected == 'true' || needs.detect-clients.outputs.activating == 'true'
    needs: [detect-clients]
    # Fork PRs fall back to the free GitHub-hosted macOS runner: on a public repo,
    # untrusted PR code must never touch the self-hosted M5 (RCE + secret exposure).
    # Own pushes and same-repo PRs use the M5, which keeps Xcode, xcodegen and
    # DerivedData between runs — no cold install each time.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && fromJSON('["self-hosted", "macOS"]') || 'xcode-27' }}
    defaults:
      run:
        working-directory: projects/native-apps/ios
    steps:
      - uses: actions/checkout@v6

      # The self-hosted M5 already has Xcode and xcodegen installed; only the cold
      # GitHub-hosted fallback needs to select a toolchain and install xcodegen.
      - name: Select the newest stable Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: runner.environment == 'github-hosted'
        run: brew install xcodegen

      # No SIM override: the Makefile owns device selection (newest iPhone runtime),
      # so CI verifies the same baselines the pre-commit hook records and checks.
      - name: Run the tests on the Makefile's iPhone simulator
        run: make test

      - name: Upload the test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: projects/native-apps/ios/build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Build + upload the iOS app (and its embedded share extension, in one build)
  # to TestFlight once the same push's server changes have reached production.
  ios-testflight-publish:
    if: >-
      !cancelled()
      && needs.web-tests.result == 'success'
      && needs.perf-tests.result == 'success'
      && needs.detect-projects.result == 'success'
      && needs.ios-tests.result == 'success'
      && needs.detect-clients.outputs.publishing-enabled == 'true'
      && (needs.detect-clients.outputs.ios-affected == 'true' || needs.detect-clients.outputs.activating == 'true')
      && (needs.detect-projects.outputs.platform-affected == 'false' || needs.deploy-platform.result == 'success')
      && (needs.detect-projects.outputs.save-link-affected == 'false' || needs.deploy-save-link.result == 'success')
      && (needs.detect-projects.outputs.has-matrix-projects == 'false' || needs.pipeline.result == 'success')
    needs: [web-tests, perf-tests, detect-projects, detect-clients, ios-tests, deploy-platform, deploy-save-link, pipeline]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-ios-testflight.yml
    secrets: inherit
