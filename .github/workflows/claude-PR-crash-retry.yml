name: Claude Code Crash Retry

# The pinned claude-code-action (v1.0.72) bundles an agent-SDK that
# intermittently crashes at startup with an ajv keyword:"dependencies"
# validation error (anthropics/claude-code-action#852), exiting ~60s in before
# the agent does any work. It is unfixed upstream and the action is pinned for
# the Max-plan OAuth fix. The crash is intermittent across job invocations, so
# re-running a crashed run is a fresh roll (verified: a crashed run succeeded on
# rerun attempt 2). Re-run (not in-job retry, which shares the same inputs and
# crashes together) up to 4 attempts; only fast failures are re-run so genuine
# post-work failures are left alone. Reruns reuse the sticky tracking comment,
# so they add no comments.
on:
  workflow_run:
    workflows: ["Claude Code"]
    types: [completed]

jobs:
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run only a fast startup crash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          ended=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .updated_at)
          dur=$(( $(date -d "$ended" +%s) - $(date -d "$started" +%s) ))
          echo "run $RUN_ID attempt $ATTEMPT duration ${dur}s"
          # The #852 startup crash exits before the agent works (~60s). A genuine
          # failure (agent ran, then errored) takes minutes — do not re-run those,
          # to avoid repeating real work.
          if [ "$dur" -le 240 ]; then
            echo "Fast failure — re-running (likely the intermittent #852 startup crash)."
            gh run rerun "$RUN_ID" --repo "$REPO"
          else
            echo "Slow failure (${dur}s) — leaving it; not a startup crash."
          fi
