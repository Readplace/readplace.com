name: Project Deployment

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-572337278115-ap-southeast-2
      PULUMI_STACK: staging
      PULUMI_CONFIG_PASSPHRASE: ''
    steps:
      - name: Refuse to deploy over a newer commit's completed run
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error::A GitHub API call failed, so the commits after ${GITHUB_SHA} on ${GITHUB_REF_NAME} could not be checked. This is not a refusal: re-run this job."' ERR
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}" --jq .commit.sha)
          NEWER=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${TIP}" --jq '.commits[].sha')
          for sha in $NEWER; do
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100" \
              --jq "[.workflow_runs[] | select(.event == \"push\" and .head_branch == \"${GITHUB_REF_NAME}\" and .status == \"completed\")][0] | select(. != null) | \"\(.id) \(.conclusion)\"")
            if [ -n "$RUN" ]; then
              echo "::error::CI run ${RUN%% *} for $sha (${RUN#* }) completed after this run was created, so deploying $GITHUB_SHA now could roll prod back. Refused. If that run deployed, prod already has it. If it failed or was cancelled, re-run it, or push. To roll back on purpose, revert and push. Do not re-run this run."
              exit 1
            fi
          done

      - name: Export all repository and environment secrets as env vars
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          DELIM="EOF_$(openssl rand -hex 16)"
          printf '%s' "$SECRETS_JSON" | jq -r --arg d "$DELIM" '
            to_entries[]
            | select(.key != "github_token")
            | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Docker Buildx + AWS CLI are pre-installed on ubuntu-latest, but buildx
      # requires explicit setup for the multi-platform builder. save-link's
      # deploy-infra script runs build-image.mjs before pulumi up; that
      # script does its own `aws ecr get-login-password | docker login`.
      - name: Configure Docker Buildx for OCR image build
        if: inputs.project == 'save-link'
        uses: docker/setup-buildx-action@v3

      # hutch's post-deploy drives a browser against the deployed stack.
      - uses: ./.github/actions/pinned-browsers
        if: inputs.project == 'hutch'

      - name: Deploy ${{ inputs.project }} to staging
        run: pnpm nx run ${{ inputs.project }}:deploy-infra

      - name: Post-deploy staging
        run: pnpm nx run ${{ inputs.project }}:post-deploy

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-staging-results-${{ inputs.project }}
          path: projects/${{ inputs.project }}/test-results-staging/
          retention-days: 7

      - name: Upload screen-response perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-staging-results-${{ inputs.project }}
          path: projects/${{ inputs.project }}/test-results-staging/perf/
          retention-days: 90
          if-no-files-found: ignore

  deploy-prod:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ap-southeast-2
      PULUMI_BACKEND_URL: s3://hutch-pulumi-state-278728209435-ap-southeast-2
      PULUMI_STACK: prod
      PULUMI_CONFIG_PASSPHRASE: ''
    steps:
      - name: Export all repository and environment secrets as env vars
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          DELIM="EOF_$(openssl rand -hex 16)"
          printf '%s' "$SECRETS_JSON" | jq -r --arg d "$DELIM" '
            to_entries[]
            | select(.key != "github_token")
            | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Docker Buildx for OCR image build
        if: inputs.project == 'save-link'
        uses: docker/setup-buildx-action@v3

      - name: Deploy ${{ inputs.project }} to prod
        run: pnpm nx run ${{ inputs.project }}:deploy-infra

      - name: Post-deploy prod
        run: pnpm nx run ${{ inputs.project }}:post-deploy
