name: Claude Conflict Detection

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: conflict-detection
  cancel-in-progress: true

jobs:
  # ┌─────────────────────────────────────────────────────────────────┐
  # │ CI PASSED ON MAIN: Check ALL open PRs for new conflicts        │
  # └─────────────────────────────────────────────────────────────────┘
  check-all-prs-for-conflicts:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check all open PRs for conflicts
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const MAX_ATTEMPTS = 5;
            const DEDUP_WINDOW_MS = 60 * 60 * 1000;
            const MARKER = '<!-- CLAUDE_CONFLICT_FIX -->';
            const LIMIT_MARKER = '<!-- CLAUDE_CONFLICT_FIX_LIMIT -->';
            const HEAD_RE = /<!-- CONFLICT_FIX_HEAD: ([0-9a-f]{40}) -->/;

            const { owner, repo } = context.repo;

            // Get all open PRs targeting main
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            console.log(`Found ${pulls.length} open PRs targeting main`);

            for (const pr of pulls) {
              // Get detailed PR info to check mergeable state
              let detail = await github.rest.pulls.get({
                owner, repo,
                pull_number: pr.number
              }).then(r => r.data);

              // Wait briefly for GitHub to compute mergeable state if needed
              if (detail.mergeable === null) {
                await new Promise(r => setTimeout(r, 2000));
                detail = await github.rest.pulls.get({
                  owner, repo,
                  pull_number: pr.number
                }).then(r => r.data);
              }

              // Skip if no conflicts
              if (detail.mergeable !== false) {
                console.log(`PR #${pr.number} has no conflicts`);
                continue;
              }

              const head = detail.head.sha;

              // Paginate rather than reading one page: listComments returns OLDEST first,
              // so a bounded page reads a frozen prefix of the PR's history once the PR
              // outgrows it — which is how the 1h dedup went blind and 167 requests
              // accumulated across 9 PRs.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const requests = comments.filter(c => c.body.includes(MARKER));
              const lastRequest = requests[requests.length - 1];

              if (lastRequest && Date.now() - new Date(lastRequest.created_at).getTime() < DEDUP_WINDOW_MS) {
                console.log(`PR #${pr.number} already has a conflict fix request within 1h, skipping`);
                continue;
              }

              // Counted from the requests that name the CURRENT head, so pushing a commit
              // resets the budget without any counter to keep in sync. A human @claude
              // comment bypasses this cap entirely — it is a bound on the automated loop,
              // not on the PR.
              const attempts = requests.filter(c => c.body.match(HEAD_RE)?.[1] === head).length;

              if (attempts >= MAX_ATTEMPTS) {
                const noticed = comments.some(c =>
                  c.body.includes(LIMIT_MARKER) && c.body.match(HEAD_RE)?.[1] === head
                );
                if (!noticed) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number,
                    body: [
                      LIMIT_MARKER,
                      `<!-- CONFLICT_FIX_HEAD: ${head} -->`,
                      '',
                      `🛑 **Conflict fix limit reached**: ${MAX_ATTEMPTS} automated attempts did not clear the conflicts on \`${head.slice(0, 7)}\`.`,
                      '',
                      'Resolve them manually — pushing a commit resets the budget.',
                      '',
                      'cc @FagnerMartinsBrack',
                    ].join('\n'),
                  });
                }
                console.log(`PR #${pr.number} reached the conflict fix limit for ${head}, skipping`);
                continue;
              }

              // Post @claude comment with minimal context - instructions are in .md file
              const prompt = [
                MARKER,
                `<!-- CONFLICT_FIX_HEAD: ${head} -->`,
                '',
                '@claude Resolve conflicts. Use your Read tool to read the local file `.github/workflows/claude-PR-conflict-fixer.md` for instructions. The file is in the checked-out repository.',
                '',
                '## Context',
                `- **Repo**: ${owner}/${repo}`,
                `- **PR**: #${pr.number}`,
                `- **Branch**: ${detail.head.ref}`,
                `- **Attempt**: ${attempts + 1} of ${MAX_ATTEMPTS}`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: prompt
              });

              console.log(`Posted @claude conflict fix request for PR #${pr.number} (attempt ${attempts + 1})`);
            }
