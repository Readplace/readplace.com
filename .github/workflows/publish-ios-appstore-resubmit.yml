name: Submit iOS build for App Review

# Submits (or resubmits after a rejection) a TestFlight build for App Store
# review via the fastlane `resubmit` lane: reconciles the version record's
# string to <major.minor>.<build>, attaches the build, pushes the listing
# metadata (including the review notes), and submits — reusing the rejection's
# still-open review submission when one exists. Manual-only, and deliberately
# never wired into the on-push pipeline: dispatching this workflow IS the
# human "Submit for Review" act.
#
# Runs on ubuntu: the lane is pure App Store Connect API (no xcodebuild, no
# signing), so it needs none of the macOS/Xcode/match setup the beta lane has.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "TestFlight build number to attach and submit (e.g. 67)"
        type: string
        required: true

concurrency:
  group: ios-appstore-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/native-apps/ios
    steps:
      - uses: actions/checkout@v6

      # If the publishing secrets aren't set, skip cleanly instead of red-failing
      # the run — mirrors the TestFlight publish workflow.
      - id: preflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect secrets not configured — skipping submission."
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.preflight.outputs.configured == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: projects/native-apps/ios

      - name: Write the App Store Connect API key
        if: steps.preflight.outputs.configured == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p fastlane/secrets
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > fastlane/secrets/AuthKey.p8

      - name: Attach the build and submit for App Review
        if: steps.preflight.outputs.configured == 'true'
        run: bundle exec fastlane resubmit build:${{ inputs.build }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ./fastlane/secrets/AuthKey.p8
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          # Reviewer contact (required by ASC to create the App Review detail;
          # phone in +<country> format) and the optional demo account. PII and
          # credentials live in environment secrets, never in git.
          ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
          ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          ASC_REVIEW_DEMO_USER: ${{ secrets.ASC_REVIEW_DEMO_USER }}
          ASC_REVIEW_DEMO_PASSWORD: ${{ secrets.ASC_REVIEW_DEMO_PASSWORD }}
