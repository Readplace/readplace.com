name: Visual Review

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  # Reads the transition frames the CI run left on the host and
  # asks a local vision model whether any frame is structurally broken. Lives in
  # its own file so that a hold or a failure here can never stop ci.yml, and
  # runs outside a container because inference needs Metal.
  visual-review:
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      RUN_DIR: /Users/fagnerbrack/ci-frames/${{ github.event.workflow_run.id }}
      STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}
      REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark the reviewed commit as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST "$STATUS_URL"
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --data "{\"state\":\"pending\",\"context\":\"Visual Review\",\"target_url\":\"$REVIEW_RUN_URL\",\"description\":\"Reviewing transition frames\"}"

      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/runner/macos

      # The macOS runner carries Xcode for ios-tests, not node.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Review transition frames with the local vision model
        id: review
        env:
          FRAMES_DIR: ${{ env.RUN_DIR }}/frames
          VLM_MODEL: mlx-community/Qwen3-VL-30B-A3B-Instruct-4bit
          VLM_PYTHON: /Users/fagnerbrack/.readplace-ci/vlm-venv/bin/python
        run: node .github/runner/macos/review-frames.mjs

      - name: Upload the frames the model reported defects in
        if: steps.review.outputs.defect-count != '0' && steps.review.outputs.defect-count != ''
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-found-${{ steps.review.outputs.defect-count }}-defects-in-transition-frames-${{ github.event.workflow_run.head_sha }}
          path: flagged-frames
          retention-days: 30
          if-no-files-found: ignore

      # Playwright writes screenshots only on failure and traces only on retry,
      # so once its bookkeeping file is excluded below this directory has
      # contents exactly when a test failed. The runner that produced them is
      # ephemeral, so without collecting them here they are lost.
      - name: Collect the screenshots and traces from any failed test
        if: always()
        run: |
          if [ -d "$RUN_DIR/playwright" ]; then
            cp -R "$RUN_DIR/playwright" failed-test-evidence
          fi

      - name: Upload the screenshots and traces from the failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-check-playwright-screenshots-and-traces-${{ github.event.workflow_run.head_sha }}
          path: |
            failed-test-evidence
            !failed-test-evidence/**/.last-run.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Post the review verdict on the reviewed commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST "$STATUS_URL"
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --data "{\"state\":\"$VERDICT\",\"context\":\"Visual Review\",\"target_url\":\"$REVIEW_RUN_URL\",\"description\":\"Transition frame review: $VERDICT\"}"
