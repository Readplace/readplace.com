<main class="embed-preview" data-test-page="embed-preview">
  <div class="embed-preview__container">
    <h1 class="embed-preview__title">Embed preview</h1>
    <p class="embed-preview__intro">Each variant is rendered on 3 fixed publisher backgrounds to check contrast, borders and image fallback before a change ships. Search engines don't index this page.</p>

    {{#each stages}}
    <section class="embed-preview__group" data-test-bg="{{key}}">
      <h2 class="embed-preview__group-title">{{title}}</h2>
      <div class="embed-preview__stage {{stageClass}}">
        {{#each rows}}
        <div class="embed-preview__row">
          <span class="embed-preview__row-label">{{label}}</span>
          <span class="embed-preview__row-slot">
            {{{preview}}}
          </span>
        </div>
        {{/each}}
      </div>
    </section>
    {{/each}}
  </div>
</main>
