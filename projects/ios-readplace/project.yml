name: Readplace
options:
  bundleIdPrefix: com.readplace
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 0.1 is the major.minor source of truth; bump it here to start a new line.
    # In CI the patch is overridden to the build counter, so TestFlight shows
    # <major.minor>.<build>. The literal patch here is only the local `make ipa` default.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Pin the permissive (default) concurrency checking so the app compiles
    # cleanly regardless of the Xcode version's default.
    SWIFT_STRICT_CONCURRENCY: minimal
    # Manual signing: the GUI Signing & Capabilities tab is unavailable on this
    # machine, so fastlane injects DEVELOPMENT_TEAM and the per-target
    # PROVISIONING_PROFILE_SPECIFIER at build time (update_code_signing_settings)
    # from env/match. Nothing identifying is committed here, and unsigned
    # `make ipa` still works because it forces CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Readplace:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readplace
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Must be set per target: XcodeGen injects its platform default "1,2"
        # into every target's build settings, which overrides any project-level
        # value — so iPhone-only (no iPad in App Store review scope) only holds
        # if each shipping target pins it here.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ShareExtension
    scheme:
      testTargets:
        - ReadplaceTests

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.readplace.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  ReadplaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Readplace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readplace.Tests
        GENERATE_INFOPLIST_FILE: YES
