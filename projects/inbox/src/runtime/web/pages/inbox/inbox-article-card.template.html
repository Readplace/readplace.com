<article class="inbox-article-card" data-test-inbox-article-card="{{ordinal}}"{{#if cardPollUrl}} hx-get="{{cardPollUrl}}" hx-trigger="every 3s" hx-target="this" hx-swap="outerHTML"{{/if}} data-card-status="{{cardStatus}}">
	{{#if hasTitle}}
	<a class="inbox-article-card__title" href="{{url}}" target="_blank" rel="noopener noreferrer" data-test-inbox-article-title>{{title}}</a>
	<span class="inbox-article-card__url" data-test-inbox-article-url>{{url}}</span>
	{{else}}
	<a class="inbox-article-card__title inbox-article-card__title--bare" href="{{url}}" target="_blank" rel="noopener noreferrer" data-test-inbox-article-url>{{url}}</a>
	{{/if}}
	<form class="inbox-article-card__feedback" method="POST" action="{{feedbackAction}}">
		<input type="hidden" name="verdict" value="should-be-excluded">
		<button type="submit" class="inbox-article-card__feedback-button" aria-label="Not an article? {{url}}" data-test-inbox-feedback-exclude>Not an article?</button>
	</form>
</article>
