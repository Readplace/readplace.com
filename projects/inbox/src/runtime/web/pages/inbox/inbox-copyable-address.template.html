<div class="form-input form-input--within inbox-copyable">
  <input class="form-input__control" type="text" value="{{address}}" readonly aria-label="{{addressAriaLabel}}" data-inbox-address="{{address}}" />
  <button type="button" class="btn btn--secondary btn--compact inbox-copyable__copy" data-inbox-copy data-inbox-address="{{address}}" aria-label="{{copyAriaLabel}}" hidden>Copy</button>
</div>
