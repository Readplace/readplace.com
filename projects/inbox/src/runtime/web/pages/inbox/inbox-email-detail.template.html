<main class="inbox-email-detail" data-test-inbox-email-detail>
	<header class="inbox-email-detail__header">
		<a class="inbox-email-detail__back" href="{{backHref}}" data-test-inbox-back>← Inbox</a>
		<h1 class="inbox-email-detail__subject" data-test-inbox-detail-subject>{{subject}}</h1>
		<p class="inbox-email-detail__meta">
			<span data-test-inbox-detail-sender>{{sender}}</span>
			<time class="inbox-email-detail__received" datetime="{{received.iso}}" data-local-time="{{received.mode}}">{{received.label}}</time>
			{{{linkCountHtml}}}
		</p>
	</header>

	<nav class="inbox-email-detail__tabs" aria-label="Email views" data-test-inbox-tabs>
		{{#each tabs}}
		<a
			class="inbox-email-detail__tab"
			href="{{href}}"
			data-test-inbox-tab="{{key}}"
			{{#if ariaCurrent}}aria-current="{{ariaCurrent}}"{{/if}}
			>{{label}}</a
		>
		{{/each}}
	</nav>

	{{{panelHtml}}}
</main>
