<main class="account-locked">
  <div class="account-locked__card">
    <h1 class="account-locked__title">Your account is locked</h1>
    <p class="account-locked__lede">Your email was never verified within 7 days of signing up, so your account is locked. Email <a class="account-locked__link" href="mailto:{{contactEmail}}">{{contactEmail}}</a> and I'll restore your access.</p>
    <form method="POST" action="{{track '/logout' source='inbox-account-locked' content='logout'}}">
      <button class="btn btn--primary account-locked__signout" type="submit">Sign out</button>
    </form>
  </div>
</main>
