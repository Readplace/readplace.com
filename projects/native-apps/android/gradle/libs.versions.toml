[versions]
# AGP 9.3.x is the current stable line; it pins the Gradle version in
# gradle/wrapper/gradle-wrapper.properties and the compileSdk below.
agp = "9.3.2"
# The Compose compiler plugin ships inside Kotlin, so its version IS this one.
kotlin = "2.3.21"
# Pinned directly rather than through the Compose BOM: the current BOM resolves
# Compose 1.12, whose AAR metadata demands compileSdk 37 — an SDK platform Google
# does not publish in any channel yet, so it cannot be built at all. 1.11 needs
# only 35. Move to the BOM once platform 37 ships.
compose = "1.11.0"
compose-material3 = "1.4.0"
coroutines = "1.10.2"
# 5.5 raised its AAR metadata to compileSdk 37, which Google does not publish yet
# (same wall as Compose 1.12 above); 5.4 is the newest that builds against 36.
okhttp = "5.4.0"
serialization = "1.9.0"
coil = "3.4.0"
androidx-browser = "1.10.0"
androidx-activity = "1.12.0"
androidx-lifecycle = "2.10.0"
media3 = "1.9.0"
junit = "4.13.2"
robolectric = "4.16.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
