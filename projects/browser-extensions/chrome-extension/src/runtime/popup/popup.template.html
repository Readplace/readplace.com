<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root{--popup-bg:#fff;--popup-text:#1a202c;--popup-label:#5a6170;--popup-border:#e8ebf0}
    @media(prefers-color-scheme:dark){:root{--popup-bg:#1a2332;--popup-text:#d8dae0;--popup-label:#7a8290;--popup-border:#263044}}
    html{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--popup-bg)}
    body{width:350px;margin:0;padding:0;background:var(--popup-bg);color:var(--popup-text)}
    .view[hidden]{display:none}
    .popup-shell .saving-view{width:350px;height:203px;padding:0;gap:0}
    .popup-shell .saving-view__skeleton{position:relative;width:350px;height:203px}
    .popup-shell p{margin:0}
    .popup-shell .saved-view__subtitle,.popup-shell .shortcut-hint{color:var(--popup-label)}
    .popup-shell .saving-view__icon,.popup-shell .saving-view__bar{position:absolute;display:block;background:currentColor;opacity:.25}
    .popup-shell .saving-view__icon{left:151px;top:16px;width:48px;height:48px;border-radius:50%}
    .popup-shell .saving-view__bar{border-radius:4px}
    .popup-shell .saving-view__bar--title{left:119px;top:82.03125px;width:112px;height:11.1875px}
    .popup-shell .saving-view__bar--subtitle{left:97px;top:100.90625px;width:156px;height:9.09375px}
    .popup-shell .saving-view__action{position:absolute;left:100px;top:128px;width:150px;height:41px;box-sizing:border-box;margin:0;padding:0;border:2px solid var(--popup-border);border-radius:6px}
    .popup-shell .saving-view__bar--action{left:24px;top:15.265625px;width:98px;height:9.796875px}
    .popup-shell .saving-view__bar--hint{left:87px;top:185.15625px;width:176px;height:7.6875px}
  </style>
</head>
<body class="popup-shell">
  <div id="saving-view" class="view saving-view" aria-busy="true">
    <div id="saving-progress" class="saving-view__skeleton" aria-hidden="true">
      <span class="saving-view__icon"></span>
      <div>
        <p class="saved-view__title"><span class="saving-view__bar saving-view__bar--title"></span></p>
        <p class="saved-view__subtitle"><span class="saving-view__bar saving-view__bar--subtitle"></span></p>
      </div>
      <div>
        <span class="saving-view__action"><span class="saving-view__bar saving-view__bar--action"></span></span>
      </div>
      <p class="shortcut-hint"><span class="saving-view__bar saving-view__bar--hint"></span></p>
    </div>
  </div>
  <script src="popup-entry.browser.js"></script>
</body>
</html>
