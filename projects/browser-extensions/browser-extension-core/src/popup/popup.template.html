<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Readplace</title>
  <style>
{{themeTokens}}
    html{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--card)}
    body{width:400px;max-width:100%;height:600px;overflow:hidden;margin:0;padding:0;background:var(--card);color:var(--foreground)}
    .view[hidden]{display:none}
    .popup-shell .saving-view{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;padding:0;gap:0}
    .popup-shell .saving-view__skeleton{position:relative;width:100%;height:200.1875px;color:var(--muted-foreground)}
    .popup-shell p{margin:0}
    .popup-shell .saving-view__icon,.popup-shell .saving-view__bar{position:absolute;display:block;background:currentColor;opacity:.25}
    .popup-shell .saving-view__icon,.popup-shell .saving-view__bar--title,.popup-shell .saving-view__bar--subtitle,.popup-shell .saving-view__action,.popup-shell .saving-view__bar--hint{left:50%;transform:translateX(-50%)}
    .popup-shell .saving-view__icon{top:0;width:48px;height:48px;border-radius:50%}
    .popup-shell .saving-view__bar{border-radius:var(--radius-sm)}
    .popup-shell .saving-view__bar--title{top:68.03125px;width:112px;height:11.1875px}
    .popup-shell .saving-view__bar--subtitle{top:91.265625px;width:168px;height:9.796875px}
    .popup-shell .saving-view__action{position:absolute;top:121px;width:144px;height:48px;box-sizing:border-box;margin:0;padding:0;border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--border)}
    .popup-shell .saving-view__bar--action{left:16px;top:18.40625px;width:112px;height:11.1875px}
    .popup-shell .saving-view__bar--hint{top:186.39375px;width:62.734375px;height:8.4px}
  </style>
</head>
<body class="popup-shell">
  <div id="saving-view" class="view saving-view" aria-busy="true">
    <div id="saving-progress" class="saving-view__skeleton" aria-hidden="true">
      <span class="saving-view__icon"></span>
      <div>
        <p class="saved-view__title"><span class="saving-view__bar saving-view__bar--title"></span></p>
        <p class="saved-view__subtitle"><span class="saving-view__bar saving-view__bar--subtitle"></span></p>
      </div>
      <div>
        <span class="saving-view__action"><span class="saving-view__bar saving-view__bar--action"></span></span>
      </div>
      <p class="shortcut-hint"><span class="saving-view__bar saving-view__bar--hint"></span></p>
    </div>
  </div>
  <script src="popup-entry.browser.js"></script>
</body>
</html>
