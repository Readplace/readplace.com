<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.styles.css">
</head>
<body>

        </a>
      </div>
      <button id="login-button" class="login__submit" type="button">Log in to Readplace</button>
      <p id="login-error" class="login__error" hidden></p>
    </div>
  </div>

  <div id="saved-view" class="view saved-view" hidden>
    <div class="saved-view__icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div id="saved-messages" role="status"></div>
    <div id="saved-affordances"></div>
    <p class="shortcut-hint">Tip: Use <kbd>Ctrl</kbd>+<kbd>D</kbd> to save from any page</p>
  </div>

  <div id="save-all-view" class="view saved-view" hidden>
    <p class="saved-view__title" data-test-save-all-title>Saving tabs&hellip;</p>
    <p id="save-all-hint" class="saved-view__subtitle" data-test-save-all-hint>Saving continues if you close this. We&rsquo;ll notify you when it&rsquo;s done.</p>
    <p class="saved-view__subtitle" data-test-save-all-summary></p>
    <p class="saved-view__subtitle" data-test-save-all-too-big hidden></p>
    <button id="save-all-view-queue" class="saved-view__action" hidden>View Queue</button>
  </div>

  <div id="list-view" class="view" hidden>
    <div class="list-view__header">
      <a href="https://readplace.com/queue?utm=ff-ext" class="list-view__brand" aria-label="Open Readplace queue" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="list-view__brand-icon" aria-hidden="true" focusable="false"><rect x="15" y="15" width="482" height="482" rx="102" fill="#2B3A55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="20"/><path d="M204.28 400Q159.02 400 134.54 383.62Q110.07 363.57 110.07 326.4Q110.07 304.69 119.27 290.89Q128.47 277.09 143.19 268.26Q157.91 259.42 174.84 252.8Q160.12 235.87 153.5 221.89Q146.87 207.9 146.87 190.98Q146.87 164.11 165.09 148.84Q183.3 133.57 220.84 133.57Q245.86 133.57 261.32 140.74Q276.78 147.92 283.95 159.7Q291.13 171.47 291.13 185.82Q291.13 208.27 277.51 222.62Q263.9 236.98 235.56 250.22L290.39 308.74Q293.34 298.43 294.62 285Q295.91 271.57 295.91 259.42V243.23H314C325 243.23 337 230.15 344 230.15C348 230.15 350 231.2 353 231.2C356 231.2 359 229.95 362.5 229.95C369.2 229.95 374.6 235.4 374.6 242C374.6 246.6 371.9 250.6 367.6 251.8C356.85 254.8 344.24 265.44 338.78 269.91Q332.71 274.88 329.77 286.29Q326.82 296.59 322.78 308Q318.73 319.41 313.21 331.55L350.01 369.82Q355.9 376.45 363.81 378.47Q371.72 380.5 381.29 380.5H384.6V400H311.74L284.14 371.3Q271.62 384.54 251.75 394.11Q231.88 400 204.28 400ZM220.1 233.66Q235.19 224.83 242.18 213.98Q249.18 203.12 249.18 186.19Q249.18 172.21 242.55 163.93Q235.93 155.65 222.68 155.65Q209.8 155.65 202.81 163.74Q195.82 171.84 195.82 186.56Q195.82 199.07 202.07 209.93Q208.33 220.78 220.1 233.66ZM214.95 378.29Q232.62 378.29 246.05 370.93Q259.48 363.57 267.94 353.26L190.66 270.83Q177.78 280.03 171.9 293.46Q166.01 306.9 166.01 325.66Q166.01 350.69 179.44 364.49Q192.87 378.29 214.95 378.29Z" fill="#FFFFFF"/><circle cx="353" cy="182" r="44" fill="#C8923C"/></svg>
        <span class="list-view__brand-name">Readplace</span>
      </a>
      <div class="list-view__actions">
        <button id="save-all-tabs-button" class="list-view__save-all" title="Save all tabs in this window" data-test-save-all-tabs hidden>Save all tabs</button>
        <button id="logout-button" class="list-view__logout" title="Log out">Log out</button>
      </div>
    </div>
    <div class="list-view__search">
      <input
        type="text"
        id="filter-input"
        class="list-view__filter"
        placeholder="Search articles..."
      >
    </div>
    <div id="messages" class="messages" role="status" hidden></div>
    <p id="list-warning" class="list-view__warning" role="status" hidden></p>
    <div id="link-list" class="list-view__links"></div>
    <div id="pagination" class="pagination" hidden></div>
    <p id="empty-list" class="list-view__empty" hidden>No unread links</p>
    <p id="no-matches" class="list-view__empty" hidden>No matching links</p>
    <p id="list-error" class="list-view__error" hidden></p>
  </div>

  <div id="saving-view" class="view saving-view">
    <p class="saving-view__title" role="status">Saving&hellip;</p>
  </div>

  <div id="spinner-overlay" class="spinner-overlay" hidden>
    <div class="spinner-overlay__dot"></div>
  </div>

  <script src="popup.browser.js"></script>
</body>
</html>
