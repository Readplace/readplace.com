  hutch:rawEmailBucketName: hutch-inbox-raw-email-prod
  hutch:alertEmail: readplace+devops@readplace.com
  hutch:gmailConnectionCapWarnThreshold: 50
  hutch:oauthRefreshRefusedDailyThreshold: 5
  hutch:googleWorkspaceMail:
    domain: readplace.com
    # Route53 allows one TXT record per name, so this array is the COMPLETE apex
    # TXT set: the Google Workspace SPF plus the existing Search Console token.
    # Add any new apex TXT value here (not in the DNS console) or the next deploy
    # overwrites it away.
    apexTxt:
      - v=spf1 include:_spf.google.com ~all
      - google-site-verification=zdl9VpwRUFtND0VHDIbtCglJaj-IYCxSVFonNTV6qPg
    dkimRecord: "v=DKIM1; k=rsa; "
