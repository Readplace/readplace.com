<form class="{{formClass}}" method="POST" action="{{action}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-wizard="{{key}}" data-test-wizard-step="{{stepId}}" data-test-wizard-surface="{{surface}}">
  {{{fieldHtml}}}
  <p class="{{errorClass}}" id="{{errorId}}" role="alert" data-test-wizard-error>{{error}}</p>
  <button class="btn btn--primary" type="submit" data-test-action="{{saveTestAction}}">{{submitLabel}}</button>
  {{{cancelHtml}}}
</form>
