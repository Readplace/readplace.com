{{#if hasItems}}{{#each items}}<li class="highlights__item" data-highlight-id="{{id}}" data-highlight-quote="{{quote}}" data-test-highlight><blockquote class="highlights__quote">{{quote}}</blockquote>{{#if note}}<p class="highlights__note" data-test-highlight-note>{{note}}</p>{{/if}}<form class="highlights__delete-form" method="POST" action="{{deleteUrl}}" hx-post="{{deleteUrl}}" hx-target="[data-highlights-list]" hx-swap="innerHTML" data-test-highlight-delete><button class="highlights__delete" type="submit">Delete</button></form></li>{{/each}}{{else}}<li class="highlights__empty" data-test-highlights-empty>No highlights yet. Select text in the article, then choose “Add highlight from selection”.</li>{{/if}}
