<div class="confirm-popover__actions share-dialog">
  <div class="share-dialog__founder">
    <img class="share-dialog__avatar" src="{{founderAvatarUrl}}" alt="" width="52" height="52" aria-hidden="true" data-test-share-avatar>
    <div class="share-dialog__founder-text">
      <p class="share-dialog__greeting">Hi, I'm Fayner Brack.</p>
      <p class="share-dialog__sub-line">Thanks for using Readplace.</p>
    </div>
  </div>
  {{{panelHtml}}}
  <div class="confirm-popover__buttons">
    <button class="btn btn--neutral" type="button" popovertarget="{{popoverId}}" popovertargetaction="hide" data-test-action="share-cancel">Cancel</button>
  </div>
</div>
