<div id="article-header" class="article-body__header"{{#if oob}} hx-swap-oob="outerHTML"{{/if}}>
  <h1 class="article-body__title" data-test-reader-title>{{title}}</h1>
  <div class="article-body__meta">
    <span data-test-reader-site>{{siteName}}</span>
    <span class="article-body__read-time{{readTimeEmptyClass}}" data-test-reader-read-time>{{readTimeLabel}}</span>
    {{#if provenanceLabel}}
    <span class="article-body__provenance" data-test-reader-provenance title="{{provenanceLabel}}">{{{provenanceIconSvg}}}{{provenanceLabel}}</span>
    {{/if}}
    {{#each readlistTags.tags}}
    <span class="article-body__readlist-tag" data-test-readlist-tag="{{slug}}">{{label}}<form class="article-body__readlist-tag-remove-form" method="POST" action="{{../readlistTags.unassignUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
      <input type="hidden" name="queue" value="{{slug}}">
      <input type="hidden" name="returnTo" value="{{../readlistTags.returnTo}}">
      <button class="article-body__readlist-tag-remove" type="submit" data-test-unassign-readlist="{{slug}}">{{icon "x"}}<span class="sr-only">Remove from {{label}}</span></button>
    </form></span>
    {{/each}}
  </div>
  <a class="article-body__original-link" href="{{url}}" target="_blank" rel="noopener" data-test-original-link>View original</a>
</div>
