<nav class="disclosure-card__body table-of-contents__nav" aria-label="Table of contents" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
              <ol class="table-of-contents__list" role="list">
                {{#each entries}}
                <li class="table-of-contents__item">
                  <a class="table-of-contents__link" href="{{href}}" data-test-toc-section="{{anchorId}}" data-test-toc-page="{{page}}">{{label}}</a>
                  {{#if children.length}}
                  <ol class="table-of-contents__list table-of-contents__list--nested" role="list">
                    {{#each children}}
                    <li class="table-of-contents__item"><a class="table-of-contents__link table-of-contents__link--nested" href="{{href}}" data-test-toc-section="{{anchorId}}" data-test-toc-page="{{page}}">{{label}}</a></li>
                    {{/each}}
                  </ol>
                  {{/if}}
                </li>
                {{/each}}
              </ol>
            </nav>
