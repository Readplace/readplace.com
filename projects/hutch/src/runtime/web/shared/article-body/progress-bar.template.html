<div class="article-body__progress article-body__progress--visible" data-test-progress-bar="{{axis}}">
  <p class="article-body__progress-label" data-test-progress-label aria-hidden="true">{{label}}</p>
  <div class="article-body__progress-track" role="progressbar" aria-labelledby="{{labelledBy}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pctWhole}}" aria-valuetext="{{label}}"><div class="article-body__progress-fill" style="width: {{pct}}%"></div></div>
</div>
