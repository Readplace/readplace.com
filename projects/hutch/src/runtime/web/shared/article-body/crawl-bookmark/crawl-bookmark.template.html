<details class="crawl-bookmark" open><summary class="crawl-bookmark__handle" aria-label="Crawl details"><span class="crawl-bookmark__handle-grip" aria-hidden="true"></span></summary><ul class="crawl-bookmark__tabs">{{#each tabs}}<li class="crawl-bookmark__tab crawl-bookmark__tab--{{state}}" aria-disabled="{{ariaDisabled}}" data-test-crawl-bookmark-tab="{{key}}"><time class="crawl-bookmark__time" datetime="{{iso}}" data-local-time="{{mode}}">{{label}}</time>{{#if badgeLabel}}<span class="crawl-bookmark__badge">{{badgeLabel}}</span>{{/if}}</li>{{/each}}</ul></details>
