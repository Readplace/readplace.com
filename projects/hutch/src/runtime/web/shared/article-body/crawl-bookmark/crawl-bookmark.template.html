<details class="crawl-bookmark" open><summary class="crawl-bookmark__handle" aria-label="Crawl details"><span class="crawl-bookmark__handle-grip" aria-hidden="true"></span><span class="sr-only">Crawl details</span></summary><ul class="crawl-bookmark__tabs">{{#each tabs}}<li class="crawl-bookmark__tab crawl-bookmark__tab--{{state}}" aria-disabled="{{ariaDisabled}}" data-test-crawl-bookmark-tab="{{key}}"><time class="crawl-bookmark__time" datetime="{{iso}}" data-local-time="{{mode}}">{{label}}</time>{{#each badges}}<span class="{{className}}" data-test-crawl-bookmark-badge="{{key}}">{{label}}</span>{{/each}}{{#if removeVersion}}<form class="crawl-bookmark__remove" method="POST" action="{{removeVersion.url}}"><input type="hidden" name="versionMinuteId" value="{{removeVersion.minuteId}}"><button type="submit" class="btn btn--destructive btn--s crawl-bookmark__remove-btn">Delete this version</button></form>{{/if}}</li>{{/each}}</ul></details>
