<div class="highlight-toolbar" role="toolbar" aria-label="Highlight selection" data-highlight-toolbar data-highlight-opened-url="{{openedUrl}}" data-test-highlight-toolbar hidden>
  <button class="btn btn--secondary btn--s highlight-toolbar__button" type="button" data-highlight-toolbar-button data-highlight-form="{{createFormSelector}}" data-highlight-commit="submit" data-test-action="highlight">Highlight</button>
  <button class="btn btn--secondary btn--s highlight-toolbar__button{{#if local}} highlight-note__trigger{{/if}}" type="button" data-highlight-toolbar-button data-highlight-form="{{noteFormSelector}}" data-highlight-commit="dialog" data-test-action="add-note">Add note</button>
  <span class="chip chip--badge chip--accent" data-test-highlight-toolbar-beta>{{t "articleBody.highlightToolbar.beta"}}</span>
</div>
<form class="highlight-toolbar__form"{{#if local}} method="dialog" data-highlight-local="create"{{else}} method="POST" action="{{createUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none"{{#unless pushesHistory}} hx-push-url="false"{{/unless}} hx-disabled-elt="[data-highlight-toolbar-button]"{{/if}} hidden data-highlight-create-form data-test-highlight-create-form>
  <input type="hidden" name="exact" value="">
  <input type="hidden" name="start" value="">
  <input type="hidden" name="end" value="">
  <input type="hidden" name="origin" value="">
  <input type="hidden" name="after" value="">
</form>
{{#unless local}}
<div class="highlight-status" data-highlight-status data-highlight-reader="{{readerKey}}" data-highlight-check-url="{{checkUrl}}"{{#if refusal}} data-highlight-refusal="{{refusal.code}}" data-highlight-status-shown{{/if}} data-copy-saving="{{t "articleBody.highlightStatus.saving"}}" data-copy-stalled="{{t "articleBody.highlightStatus.stalled"}}" data-copy-unsure="{{t "articleBody.highlightStatus.unsure"}}" data-copy-checking="{{t "articleBody.highlightStatus.checking"}}" data-copy-highlighted="{{t "articleBody.highlightStatus.highlighted"}}" data-copy-absent="{{t "articleBody.highlightStatus.absent"}}" data-copy-unconfirmed="{{t "articleBody.highlightStatus.unconfirmed"}}" data-test-highlight-status-region>
  <div class="highlight-status__live" role="status" aria-atomic="true">
    <p class="highlight-status__message" data-highlight-status-message data-test-highlight-status>{{#if refusal}}{{refusal.message}}{{/if}}</p>
    <q class="highlight-status__quote" data-highlight-status-quote data-test-highlight-status-quote hidden></q>
  </div>
  <div class="highlight-status__actions">
    <button class="btn btn--secondary btn--s" type="button" data-highlight-status-action="stop" data-test-action="highlight-stop-waiting" hidden>{{t "articleBody.highlightStatus.stopWaiting"}}</button>
    <button class="btn btn--secondary btn--s" type="button" data-highlight-status-action="check" data-test-action="highlight-check" hidden>{{t "articleBody.highlightStatus.check"}}</button>
    <button class="btn btn--secondary btn--s" type="button" data-highlight-status-action="retry" data-test-action="highlight-retry" hidden>{{t "articleBody.highlightStatus.retry"}}</button>
    <button class="btn btn--secondary btn--s" type="button" data-highlight-status-dismiss data-test-action="highlight-status-dismiss"{{#unless refusal}} hidden{{/unless}}>{{t "articleBody.highlightStatus.dismiss"}}</button>
  </div>
</div>
{{/unless}}
{{{noteDialogHtml}}}
