<div class="highlight-toolbar" role="toolbar" aria-label="Highlight selection" data-highlight-toolbar data-test-highlight-toolbar hidden>
  <button class="btn btn--secondary btn--s highlight-toolbar__button" type="button" data-highlight-toolbar-button data-test-action="highlight">Highlight</button>
</div>
<form class="highlight-toolbar__form" method="POST" action="{{createUrl}}" hidden hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-disabled-elt="[data-highlight-toolbar-button]" data-highlight-create-form data-test-highlight-create-form>
  <input type="hidden" name="exact" value="">
  <input type="hidden" name="start" value="">
  <input type="hidden" name="end" value="">
  <input type="hidden" name="origin" value="">
</form>
