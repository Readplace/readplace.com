<div class="highlight-note-editor" id="{{id}}" popover="auto" role="dialog" tabindex="-1" aria-labelledby="{{id}}-title" aria-describedby="{{id}}-quote" data-highlight-note-editor="{{highlightId}}" data-test-confirm-popover="{{key}}" data-test-confirm-subject="{{subject}}">
  <h2 class="highlight-note-editor__title" id="{{id}}-title">{{title}}</h2>
  <blockquote class="highlight-note-editor__quote" id="{{id}}-quote" data-highlight-note-quote>{{quote}}</blockquote>
  {{{formHtml}}}
</div>
