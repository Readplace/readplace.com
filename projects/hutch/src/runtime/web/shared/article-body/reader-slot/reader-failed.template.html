<div id="article-body-reader-slot" class="article-body__reader-slot article-body__reader-slot--notice" data-test-reader-slot data-reader-status="{{variant}}"{{#if oob}} hx-swap-oob="outerHTML"{{/if}}>
	<h2 class="article-body__reader-notice-title">Your link is saved ✅</h2>
	<p class="article-body__reader-notice-text">{{explanation}}</p>
	<a class="article-body__reader-notice-link" href="{{url}}" target="_blank" rel="noopener" data-test-reader-failed-primary>
		Read it on {{hostname}} →
	</a>
	{{#if extensionInstallUrl}}
	<p class="article-body__reader-notice-extension-pitch">
		Tip: the browser extension and iPhone app capture the full page in one tap — including sites that don't open well in the reader.
		<a href="{{extensionInstallUrl}}" data-test-reader-failed-install>See the ways to save</a>
	</p>
	{{/if}}
</div>
