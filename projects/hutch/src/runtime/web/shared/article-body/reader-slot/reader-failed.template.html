<section id="article-body-reader-notice" class="article-body__card article-body__reader-notice article-body__reader-notice--visible" data-test-reader-notice data-reader-status="{{variant}}"{{#if noticeOob}} hx-swap-oob="outerHTML"{{/if}}{{#if capturePollUrl}} data-background-request hx-get="{{capturePollUrl}}" hx-trigger="readplace-capture-started from:document" hx-target="#article-body-reader-slot" hx-swap="outerHTML show:none"{{/if}}>
  <div class="article-body__reader-notice-illustration">{{{illustrationHtml}}}</div>
  <h2 class="article-body__reader-notice-title">{{title}}</h2>
  <p class="article-body__reader-notice-text">{{explanation}}</p>
  <div class="article-body__reader-notice-actions">
    <a class="btn btn--primary" href="{{url}}" target="_blank" rel="noopener" data-test-reader-failed-primary data-test-reader-action="open">{{ctaLabel}}</a>
    <button type="button" class="btn btn--secondary article-body__reader-notice-capture {{captureClass}}" data-reader-capture{{#if capturePollUrl}} data-reader-capture-poll="{{capturePollUrl}}" data-background-request hx-get="{{capturePollUrl}}" hx-trigger="click" hx-target="#article-body-reader-slot" hx-swap="outerHTML show:none" hx-disabled-elt="this"{{/if}} data-test-reader-action="capture">Capture it here</button>
  </div>
  <div class="{{pitchClass}}">{{{pitchHtml}}}</div>
</section>
