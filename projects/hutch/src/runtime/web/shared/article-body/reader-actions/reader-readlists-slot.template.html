{{#if readlistPicker}}
<div id="reader-readlists-slot" class="article-body__readlists-slot article-body__readlists-slot--visible"{{#if oob}} hx-swap-oob="outerHTML"{{/if}} data-test-readlists-slot>
  <details class="article-body__readlists">
    <summary class="btn btn--neutral article-body__readlists-trigger" data-test-readlists-trigger>{{icon "plus"}}<span class="article-body__action-label">Add to readlist</span><span class="article-body__readlists-chevron" aria-hidden="true">{{icon "chevron-down"}}</span></summary>
    <ul class="article-body__readlists-menu" data-readlist-filter-scope data-test-readlists-menu>
      {{{readlistPicker.filterHtml}}}
      {{#each readlistPicker.options}}
      <li class="article-body__readlists-item readlist-filter__option" data-test-readlists-row="{{slug}}">
        <form class="article-body__readlists-form" method="POST" action="{{../readlistPicker.assignUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
          <input type="hidden" name="queue" value="{{slug}}">
          <input type="hidden" name="returnTo" value="{{../readlistPicker.returnTo}}">
          <button class="article-body__readlists-option" type="submit" data-test-assign-readlist="{{slug}}">{{icon iconName}}<span class="article-body__readlists-option-label">{{label}}</span></button>
        </form>
      </li>
      {{/each}}
      {{#if readlistPicker.create}}
      <li class="article-body__readlists-create-item" data-test-readlists-row="create">
        <button class="article-body__readlists-option article-body__readlists-create-trigger" type="button" popovertarget="{{readlistPicker.create.popoverId}}" aria-haspopup="dialog" data-test-action="readlist-create-open">{{icon "plus"}}<span class="article-body__readlists-option-label">Create a readlist</span></button>
        <form class="article-body__readlists-create article-body__readlists-create-fallback" method="POST" action="{{readlistPicker.create.createUrl}}" hx-boost="false">
          <input type="hidden" name="returnTo" value="{{readlistPicker.returnTo}}">
          <input class="form-input" type="text" name="label" required maxlength="{{readlistPicker.create.maxLength}}" placeholder="{{readlistPicker.create.namePlaceholder}}" aria-label="{{readlistPicker.create.nameLabel}}" autocomplete="off" data-test-readlist-create-name>
          <button class="article-body__readlists-create-btn" type="submit" data-test-action="readlist-create-assign">{{icon "plus"}}<span class="sr-only">Create readlist and add</span></button>
        </form>
      </li>
      {{/if}}
    </ul>
  </details>
</div>
{{else}}
<div id="reader-readlists-slot" class="article-body__readlists-slot article-body__readlists-slot--hidden"{{#if oob}} hx-swap-oob="outerHTML"{{/if}} data-test-readlists-slot></div>
{{/if}}
