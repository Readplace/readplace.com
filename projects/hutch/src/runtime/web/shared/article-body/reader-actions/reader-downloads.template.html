<div id="reader-downloads-slot" class="article-body__downloads-slot {{#if downloadHref}}article-body__downloads-slot--visible{{else}}article-body__downloads-slot--hidden{{/if}}" data-test-downloads-slot{{#if oob}} hx-swap-oob="outerHTML"{{/if}}>
  {{#if downloadHref}}
  <a id="reader-download-epub" class="btn btn--secondary btn--compact article-body__download" href="{{downloadHref}}" data-test-download="epub"><span class="article-body__action-icon">{{icon "download"}}</span><span class="article-body__action-label">Download EPUB</span></a>
  {{/if}}
</div>
