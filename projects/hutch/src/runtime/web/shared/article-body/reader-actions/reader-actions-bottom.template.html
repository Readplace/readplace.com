<div class="article-body__actions article-body__actions--bottom">
  {{#if backLink}}
  <div class="article-body__back-bottom-slot article-body__back-bottom-slot--visible" data-test-back-bottom-slot>
    <a class="article-body__back-bottom" href="{{backLink.href}}" data-test-back-bottom-link>{{backLink.label}}</a>
  </div>
  {{else}}
  <div class="article-body__back-bottom-slot article-body__back-bottom-slot--hidden" data-test-back-bottom-slot></div>
  {{/if}}
  {{#if markRead}}
  <div class="article-body__mark-read-slot article-body__mark-read-slot--visible" data-test-mark-read-bottom-slot>
    <form class="article-body__mark-read-form" method="POST" action="{{markRead.postUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-disabled-elt=".article-body__mark-read" data-test-mark-read-bottom-form>
      {{#each markRead.fields}}
      <input type="hidden" name="{{name}}" value="{{value}}">
      {{/each}}
      <button class="article-body__mark-read" type="submit" aria-label="{{markRead.label}}" data-test-mark-read-bottom-btn><span class="article-body__mark-read-label">{{markRead.label}}</span><span class="article-body__mark-read-loader" aria-hidden="true"><span></span><span></span><span></span></span></button>
    </form>
  </div>
  {{else}}
  <div class="article-body__mark-read-slot article-body__mark-read-slot--hidden" data-test-mark-read-bottom-slot></div>
  {{/if}}
</div>
