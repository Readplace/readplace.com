<div class="article-body__actions article-body__actions--top">
  {{#if backLink}}
  <div class="article-body__back-slot article-body__back-slot--visible" data-test-back-slot>
    <a class="article-body__back" href="{{backLink.href}}" data-test-back-link>{{icon "arrow-left"}} {{backLink.label}}</a>
  </div>
  {{else}}
  <div class="article-body__back-slot article-body__back-slot--hidden" data-test-back-slot></div>
  {{/if}}
  {{#if queuePicker}}
  <div class="article-body__queues-slot article-body__queues-slot--visible" data-test-queues-slot>
    <details class="article-body__queues">
      <summary class="article-body__queues-trigger" data-test-queues-trigger>Add to queue {{icon "chevron-down"}}</summary>
      <ul class="article-body__queues-menu">
        {{#each queuePicker.options}}
        <li class="article-body__queues-item">
          <form class="article-body__queues-form" method="POST" action="{{../queuePicker.assignUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
            <input type="hidden" name="queue" value="{{slug}}">
            <input type="hidden" name="returnTo" value="{{../queuePicker.returnTo}}">
            <button class="article-body__queues-option" type="submit" data-test-assign-queue="{{slug}}">{{label}}</button>
          </form>
        </li>
        {{/each}}
      </ul>
    </details>
  </div>
  {{else}}
  <div class="article-body__queues-slot article-body__queues-slot--hidden" data-test-queues-slot></div>
  {{/if}}
  {{#if markRead}}
  <div class="article-body__mark-read-slot article-body__mark-read-slot--visible" data-test-mark-read-slot>
    <form class="article-body__mark-read-form" method="POST" action="{{markRead.postUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-disabled-elt=".article-body__mark-read" data-test-mark-read-form>
      {{#each markRead.fields}}
      <input type="hidden" name="{{name}}" value="{{value}}">
      {{/each}}
      <button class="article-body__mark-read" type="submit" aria-label="{{markRead.label}}" data-test-mark-read-btn><span class="article-body__mark-read-label">{{markRead.label}}</span><span class="article-body__mark-read-loader" aria-hidden="true"><span></span><span></span><span></span></span></button>
    </form>
  </div>
  {{else}}
  <div class="article-body__mark-read-slot article-body__mark-read-slot--hidden" data-test-mark-read-slot></div>
  {{/if}}
</div>
