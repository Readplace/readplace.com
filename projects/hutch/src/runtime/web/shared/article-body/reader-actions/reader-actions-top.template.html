<div class="article-body__actions article-body__actions--top">{{#if backLink}}<div class="article-body__back-slot article-body__back-slot--visible" data-test-back-slot><a class="article-body__back" href="{{backLink.href}}" data-test-back-link>{{backLink.label}}</a></div>{{else}}<div class="article-body__back-slot article-body__back-slot--hidden" data-test-back-slot></div>{{/if}}{{#if markRead}}<div class="article-body__mark-read-slot article-body__mark-read-slot--visible" data-test-mark-read-slot><form class="article-body__mark-read-form" method="POST" action="{{markRead.postUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-mark-read-form>{{#each markRead.fields}}<input type="hidden" name="{{name}}" value="{{value}}">{{/each}}<button class="article-body__mark-read" type="submit" data-test-mark-read-btn>{{markRead.label}}</button></form></div>{{else}}<div class="article-body__mark-read-slot article-body__mark-read-slot--hidden" data-test-mark-read-slot></div>{{/if}}</div>
