<div id="article-body-related-slot" class="article-body__related-slot {{stateClass}}" data-test-reader-related data-related-status="{{status}}"{{#if pollUrl}} hx-get="{{pollUrl}}" hx-trigger="every 3s" hx-swap="outerHTML"{{/if}}><h2 class="related-slot__heading">Similar articles you haven't read yet</h2><ul class="related-slot__list" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
  {{#each items}}
  <li class="related-slot__item">
    <a class="related-slot__link" href="{{href}}" data-test-related-item="{{id}}">
      <span class="related-slot__title">{{title}}</span>
      <span class="related-slot__meta">
        <span class="related-slot__status related-slot__status--unread" data-test-read-status="unread"><span class="related-slot__status-label">Unread</span></span>
        <span class="related-slot__site">{{siteName}}</span>
      </span>
      <span class="related-slot__reason">{{reason}}</span>
      <span class="related-slot__saved">You saved this <time datetime="{{saved.iso}}" data-local-time="{{saved.mode}}">{{saved.label}}</time></span>
    </a>
  </li>
  {{/each}}
</ul></div>
