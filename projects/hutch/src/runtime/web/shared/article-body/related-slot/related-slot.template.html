<div id="article-body-related-slot" class="article-body__related-slot {{stateClass}}" data-test-reader-related data-related-status="{{status}}"><h2 class="related-slot__heading">Related from your saves</h2><ul class="related-slot__list" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
  {{#each items}}
  <li class="related-slot__item">
    <a class="related-slot__link" href="{{href}}" data-test-related-item="{{id}}">
      <span class="related-slot__title">{{title}}</span>
      <span class="related-slot__site">{{siteName}}</span>
      <span class="related-slot__reason">{{reason}}</span>
    </a>
  </li>
  {{/each}}
</ul></div>
