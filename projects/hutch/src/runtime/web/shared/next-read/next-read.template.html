<div id="article-body-related-slot" class="next-read {{stateClass}}" data-next-read data-test-reader-related data-related-status="{{status}}"{{#if pollUrl}} hx-get="{{pollUrl}}" hx-trigger="every 3s" hx-swap="outerHTML"{{/if}}>
  {{#each cards}}
  <div class="next-read__card">
    <form class="next-read__dismiss-form" method="POST" action="{{dismissUrl}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
      <input type="hidden" name="returnTo" value="{{returnTo}}">
      <button class="next-read__dismiss" type="submit" data-test-action="next-read-dismiss">{{icon "x"}}<span class="sr-only">Dismiss suggestion</span></button>
    </form>
    <a class="next-read__link" href="{{href}}" data-test-related-item="{{id}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
      <span class="next-read__eyebrow">Next read</span>
      <span class="next-read__title">{{title}}</span>
      <span class="next-read__site">{{siteName}}</span>
      <span class="next-read__reason">{{reason}}</span>
      <span class="next-read__meta">
        <span class="next-read__status next-read__status--unread" data-test-read-status="unread"><span class="next-read__status-label">Unread</span></span>
        <span class="next-read__saved">You saved this <time datetime="{{saved.iso}}" data-local-time="{{saved.mode}}">{{saved.label}}</time></span>
      </span>
    </a>
  </div>
  {{/each}}
</div>
