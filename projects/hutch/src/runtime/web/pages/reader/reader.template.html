    <main class="reader">
      <div class="reader__article-body" data-article-body>
        {{{innerContent}}}
      </div>
      <div class="reader__float-stack" data-test-reader-float-stack>
        {{{nextRead}}}
        {{{shareBalloon}}}
      </div>
      {{#each exitConfirms}}
      <div class="reader-confirm" id="reader-exit-confirm" popover="auto" role="dialog" tabindex="-1" autofocus aria-labelledby="reader-exit-confirm-title" aria-describedby="reader-exit-confirm-article reader-exit-confirm-body" data-test-exit-confirm>
        <div class="reader-confirm__header">
          <h2 class="reader-confirm__title" id="reader-exit-confirm-title">You're leaving this article</h2>
          <button class="reader-confirm__close" type="button" popovertarget="reader-exit-confirm" popovertargetaction="hide" data-test-action="exit-confirm-dismiss">{{icon "x"}}<span class="sr-only">Close</span></button>
        </div>
        <p class="reader-confirm__article" id="reader-exit-confirm-article">{{title}}</p>
        <p class="reader-confirm__body" id="reader-exit-confirm-body">Mark as read?</p>
        <form class="reader-confirm__form" method="POST" action="{{postUrl}}">
          <input type="hidden" name="status" value="read">
          <button class="btn btn--primary reader-confirm__cta" type="submit" data-test-action="exit-confirm-yes">Yes</button>
          <button class="btn btn--secondary reader-confirm__cta reader-confirm__cta--no" type="button" data-test-action="exit-confirm-no">No</button>
        </form>
      </div>
      {{/each}}
    </main>
