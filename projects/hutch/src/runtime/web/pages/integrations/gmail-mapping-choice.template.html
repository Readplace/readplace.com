<div id="gmail-mapping-choice" class="gmail__mapping-choice"{{#if notificationSender}} data-gmail-notification="{{notificationSender}}" data-gmail-notification-highlight{{/if}}{{#if outOfBand}} hx-swap-oob="outerHTML"{{/if}}>
              <form id="gmail-readlist-selection" class="gmail__selection" method="GET" action="{{readlistPicker.pagePath}}" hx-boost="true" hx-target="#gmail-dialog-body" hx-select="#gmail-dialog-body" hx-swap="outerHTML show:none" hx-disabled-elt="#gmail-readlist-selection button, .gmail__checklist-remove" data-gmail-readlist-selection data-test-gmail-save-mapping>
                {{#each readlistPicker.fields}}
                <input type="hidden" name="{{name}}" value="{{value}}">
                {{/each}}
                {{#each dialog.senderFields}}
                <input type="hidden" name="{{name}}" value="{{value}}">
                {{/each}}
                <input type="hidden" name="readlist" value="default">
                {{{readlistPickerHtml}}}
                <fieldset class="gmail__delivery" data-test-gmail-delivery>
                  <legend class="form-field__label gmail__delivery-legend">What to save</legend>
                  {{#each delivery.options}}
                  <label class="gmail__delivery-option">
                    <input id="gmail-delivery-{{value}}" class="gmail__delivery-radio" type="radio" name="delivery" value="{{value}}"{{#if checked}} checked{{/if}} data-gmail-delivery-option data-test-gmail-delivery-option="{{value}}">
                    <span class="gmail__delivery-text"><span class="gmail__delivery-label">{{label}}</span><span class="gmail__delivery-description">{{description}}</span></span>
                  </label>
                  {{/each}}
                </fieldset>
                {{#if save.offerImport}}
                <label class="gmail__import-option">
                  <input class="gmail__import-checkbox" type="checkbox" name="import" value="1"{{#if save.importChecked}} checked{{/if}}>
                  <span>Import unread messages from the last 30 days</span>
                </label>
                {{/if}}
                <div class="confirm-popover__buttons gmail__save" data-test-gmail-dialog-footer>
                  <a class="btn btn--neutral" href="{{dialog.cancelHref}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-gmail-dialog-cancel data-test-action="{{dialog.key}}-cancel">Cancel</a>
                  <button id="gmail-save" class="btn btn--primary gmail__submit" type="submit" formmethod="post" formaction="{{save.action}}" formnovalidate{{#if save.disabled}} disabled{{/if}}{{#if save.autofocus}} autofocus{{/if}} data-gmail-dialog-save data-test-gmail-save><span class="gmail__submit-label">Save</span>{{{submitLoader}}}</button>
                </div>
              </form>
            </div>
