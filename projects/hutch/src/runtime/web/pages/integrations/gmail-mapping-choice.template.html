<div id="gmail-mapping-choice" class="gmail__mapping-choice"{{#if outOfBand}} hx-swap-oob="outerHTML"{{/if}}>
              {{{readlistPickerHtml}}}
              {{#if save}}
              <form class="gmail__save" method="POST" action="{{save.action}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-disabled-elt="find button" data-test-gmail-save-mapping>
                {{#each save.fields}}
                <input type="hidden" name="{{name}}" value="{{value}}">
                {{/each}}
                {{#if save.offerImport}}
                <label class="gmail__import-option">
                  <input class="gmail__import-checkbox" type="checkbox" name="import" value="1"{{#if save.importChecked}} checked{{/if}}>
                  <span>Import unread messages from the last 30 days</span>
                </label>
                {{/if}}
                <div class="gmail__save-row">
                  <button class="btn btn--{{save.variant}} gmail__submit" type="submit" data-test-gmail-save><span class="gmail__submit-label">Save</span>{{{submitLoader}}}</button>
                  <p class="gmail__disclosure" data-test-gmail-suggestion-disclosure>If this sender isn't a known newsletter yet, Readplace sends only its address for review.</p>
                </div>
              </form>
              {{/if}}
            </div>
