    <main class="integrations">
      <div class="integrations__container">
        <h1 class="integrations__title">Integrations</h1>
        <p class="integrations__lead">Connect a service and its email lands in Readplace.</p>

        {{#each alerts}}
        <div class="integrations__alert" role="alert" data-test-integrations-alert data-test-integrations-alert-key="{{key}}">{{message}}</div>
        {{/each}}

        <ul class="integrations__list" data-test-integrations-list>
          {{#each services}}
          <li class="integrations__item" data-test-integration="{{key}}">
            <span class="integrations__icon">{{icon iconName}}</span>
            <span class="integrations__body">
              <span class="integrations__name">{{name}}</span>
              <span class="integrations__description">{{description}}</span>
            </span>
            <span class="integrations__status {{statusModifier}}" data-test-integration-status="{{statusKey}}">{{statusLabel}}</span>
            {{#each actions}}
            <form class="integrations__action" method="{{method}}" action="{{href}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
              <button type="submit" class="btn btn--{{variant}} btn--compact" data-test-integration-action="{{key}}">{{label}}</button>
            </form>
            {{/each}}
          </li>
          {{/each}}
        </ul>
      </div>
    </main>
