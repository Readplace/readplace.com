<div id="gmail-checklist" class="gmail__checklist" data-test-gmail-checklist data-checklist-state="{{state}}">
            <p class="gmail__checklist-intro">{{intro}}</p>
            <div class="gmail__checklist-toolbar">
              {{#each actions}}
              <button id="gmail-checklist-{{key}}" class="btn btn--neutral btn--s" type="submit" form="gmail-readlist-selection" formmethod="get" formnovalidate{{#if name}} name="{{name}}" value="{{value}}"{{/if}} data-test-gmail-checklist-action="{{key}}">{{label}}</button>
              {{/each}}
            </div>
            <p class="gmail__checklist-message" data-test-gmail-checklist-message>{{message}}</p>
            <div class="gmail__checklist-rows" data-test-gmail-checklist-rows>
              {{#each groups}}
              <section class="gmail__checklist-group" data-test-gmail-checklist-group="{{key}}">
                <h3 class="gmail__checklist-group-title">{{title}}</h3>
                <ul class="gmail__checklist-list">
                  {{#each rows}}
                  <li class="gmail__checklist-row" data-test-gmail-checklist-row="{{email}}">
                    <label class="gmail__checklist-label">
                      <input class="form-choice gmail__checklist-checkbox" type="checkbox" form="gmail-readlist-selection" name="sender" value="{{email}}"{{#if checked}} checked{{/if}}{{#if autofocus}} autofocus{{/if}} data-test-gmail-checklist-sender="{{email}}">
                      <span class="gmail__checklist-text">{{#if name}}<span class="gmail__checklist-name" data-test-gmail-checklist-name>{{name}}</span>{{/if}}<span class="gmail__checklist-email">{{email}}</span></span>
                    </label>
                    {{#each fields}}
                    <input type="hidden" form="gmail-readlist-selection" name="{{name}}" value="{{value}}">
                    {{/each}}
                  </li>
                  {{/each}}
                </ul>
              </section>
              {{/each}}
            </div>
            <p class="gmail__checklist-summary" aria-live="polite" data-test-gmail-checklist-summary><span class="gmail__checklist-count"></span> of {{total}} selected</p>
            <input type="hidden" id="gmail-checklist-listed" name="listed" value="{{knownCount}}">
          </div>
