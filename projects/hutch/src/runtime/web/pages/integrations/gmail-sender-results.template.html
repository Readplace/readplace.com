<div id="gmail-sender-results" data-test-gmail-sender-results data-results-state="{{resultsState}}">
                  <ul class="gmail__options gmail__sender-options">
                    {{#each options}}
                    <li>
                      <button class="gmail__picker-option" type="submit" form="gmail-readlist-selection" formmethod="get" formnovalidate name="pick" value="{{email}}" data-gmail-picker-option data-test-gmail-sender-option="{{email}}">
                        {{#if name}}<span data-test-gmail-sender-option-name>{{name}}</span>{{/if}}<span class="gmail__option-email">{{email}}</span>
                      </button>
                    </li>
                    {{/each}}
                  </ul>
                  <p class="gmail__discovery-status" data-test-gmail-results-message{{#if refineSearch}} data-test-gmail-refine-search{{/if}}>{{resultsMessage}}</p>
                </div>
