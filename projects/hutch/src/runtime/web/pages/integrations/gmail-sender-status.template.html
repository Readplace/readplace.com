<div id="gmail-sender-status" class="gmail__sender-status" data-test-gmail-sender-status{{#if pollUrl}} data-background-request hx-get="{{pollUrl}}" hx-trigger="{{pollTrigger}}" hx-include="#gmail-checklist-listed" hx-swap="outerHTML show:none" hx-disinherit="hx-include"{{/if}}>
            <p class="gmail__discovery-status" role="status" data-test-gmail-discovery-status data-discovery-state="{{discoveryState}}">{{statusLead}}{{#if checkedLabel}}<span data-test-gmail-checked-count>{{checkedLabel}}</span>{{/if}}</p>
            {{#if discoveryAfter}}<input type="hidden" form="gmail-sender-search-form" name="discovery_after" value="{{discoveryAfter}}">{{/if}}
            {{#each reconnectActions}}
            <form method="{{method}}" action="{{action}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
              {{#each fields}}
              <input type="hidden" name="{{name}}" value="{{value}}">
              {{/each}}
              <button class="btn btn--{{variant}}" type="submit" data-test-gmail-discovery-reconnect data-test-gmail-connection-action="{{key}}">{{label}}</button>
            </form>
            {{/each}}
            {{#each refreshActions}}
            <button id="gmail-refresh-checklist" class="btn btn--neutral btn--s" type="submit" form="gmail-readlist-selection" formmethod="get" formnovalidate data-test-gmail-refresh-checklist>{{label}}</button>
            {{/each}}
          </div>
