<div id="gmail-dialog" class="confirm-popover confirm-popover--in-flow popover--scrimmed gmail-dialog" popover="auto" role="dialog" tabindex="-1" aria-labelledby="gmail-dialog-title" hx-history="false" data-gmail-dialog data-gmail-dialog-opener="{{opener}}" data-test-confirm-popover="{{key}}">
          <button class="popover__backdrop-dismiss" type="button" popovertarget="gmail-dialog" popovertargetaction="hide" tabindex="-1" aria-label="{{t "popover.close"}}"></button>
          <div class="confirm-popover__surface">
            <div class="confirm-popover__header">
              <h2 class="confirm-popover__title" id="gmail-dialog-title" data-test-gmail-dialog-title>{{title}}</h2>
              <a class="confirm-popover__close" href="{{closeHref}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-action="{{key}}-dismiss">{{icon "x"}}<span class="sr-only">{{t "popover.close"}}</span></a>
            </div>
            {{{bodyHtml}}}
          </div>
        </div>
