    <meta http-equiv="refresh" content="{{refreshDelay}};url={{redirectUrl}}">
    <main class="save-error">
      <div class="save-error__container">
        <div class="save-error__alert">
          <span class="save-error__alert-icon" aria-hidden="true">{{icon "x-circle"}}</span>
          <div class="save-error__alert-text">
            <h1 class="save-error__title">No article URL provided</h1>
            <p class="save-error__text">Redirecting in <span class="save-error__seconds" data-countdown-seconds="{{seconds}}">{{seconds}}</span> seconds...</p>
          </div>
        </div>
        <a href="{{redirectUrl}}" class="btn btn--primary save-error__link">{{linkLabel}}</a>
      </div>
    </main>
