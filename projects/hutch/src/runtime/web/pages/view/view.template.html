    <main class="view">
      <div class="reading-layout">
        <div class="reading-layout__main">
          <div class="view__body" data-article-body>
            {{{innerContent}}}
          </div>
        </div>
        <{{railLandmark.tag}} class="reading-layout__rail"{{#each railLandmark.attributes}} {{name}}="{{value}}"{{/each}} data-test-reader-rail>
          {{{railHtml}}}
        </{{railLandmark.tag}}>
      </div>
      {{{saveTipHtml}}}
      {{{shareDialogHtml}}}
    </main>
    <aside class="view__cta" data-test-view-cta>
      <div class="reading-frame">
        <div class="view__cta-content">
          {{#each ctaItems}}
          {{{html}}}
          {{/each}}
        </div>
      </div>
    </aside>
