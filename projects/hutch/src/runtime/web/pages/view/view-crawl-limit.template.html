    <main class="view-crawl-limit">
      <div class="view-crawl-limit__container">
        <h1 class="view-crawl-limit__title">{{t "view.crawlLimit.title"}}</h1>
        <p class="view-crawl-limit__text">{{t "view.crawlLimit.body"}}</p>
        <div class="view-crawl-limit__actions">
          <a href="{{signupHref}}" class="btn btn--primary" data-test-crawl-limit-action="signup">{{t "view.crawlLimit.signup"}}</a>
          <a href="{{loginHref}}" class="btn btn--secondary" data-test-crawl-limit-action="login">{{t "view.crawlLimit.login"}}</a>
        </div>
        <p class="view-crawl-limit__text" data-test-crawl-limit-wait>{{t "view.crawlLimit.wait" wait=retryWait}}</p>
      </div>
    </main>
