<section id="compare" class="home-compare" data-test-section="compare" aria-label="{{ariaLabel}}">
    <div class="home-section__container">
      <h2 class="home-section__title">{{titleLead}}<span class="home-compare__highlight">{{titleHighlight}}</span>{{titleTail}}</h2>
      <p class="home-compare__lede">{{lede}}</p>
      <table class="home-compare__table" role="table" aria-labelledby="home-compare-caption">
        <caption id="home-compare-caption" class="sr-only">{{caption}}</caption>
        <thead role="rowgroup">
          <tr role="row">
            <th scope="col" role="columnheader"><span class="sr-only">{{columns.feature}}</span></th>
            {{#each columnHeads}}
            <th scope="col" role="columnheader" class="{{headClass}}">{{label}}</th>
            {{/each}}
          </tr>
        </thead>
        <tbody role="rowgroup">
          {{#each rows}}
          <tr role="row" data-test-compare-row="{{key}}">
            <th scope="row" role="rowheader">{{label}}</th>
            {{#each cells}}
            <td role="cell" class="{{cellClass}}" data-label="{{label}}">{{#if glyph}}{{icon glyph}}{{/if}}<span class="{{textClass}}">{{text}}</span></td>
            {{/each}}
          </tr>
          {{/each}}
        </tbody>
      </table>
      <p class="home-compare__note">{{note}}</p>
      <div class="home-compare__close">
        <a class="btn btn--primary" href="{{ctaHref}}" data-test-cta="compare-signup">{{ctaLabel}}</a>
        <p class="home-compare__reassurance">{{ctaReassurance}}</p>
      </div>
    </div>
  </section>
