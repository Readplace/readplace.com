<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Add links with Share — Readplace</title>
    <style>
      :root {
        color-scheme: light dark;
        --help-bg: #ffffff;
        --help-text: #1a202c;
        --help-text-secondary: #5a6170;
        --help-brand: #c8702a;
        --help-surface: #f7f8fa;
        --help-border: #e2e5ea;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --help-bg: #121212;
          --help-text: #e4e4e4;
          --help-text-secondary: #9ba1ae;
          --help-brand: #d4833a;
          --help-surface: #1a1a1a;
          --help-border: #2e2e2e;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--help-bg);
        color: var(--help-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .help {
        max-width: 32rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }

      .help__title {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .help__steps {
        margin: 0 0 1.5rem;
        padding: 0;
        list-style: none;
        counter-reset: help-step;
      }

      .help__step {
        counter-increment: help-step;
        position: relative;
        padding: 0.75rem 0 0.75rem 3rem;
        font-size: 1.0625rem;
        border-bottom: 1px solid var(--help-border);
      }

      .help__step:last-child {
        border-bottom: 0;
      }

      .help__step::before {
        content: counter(help-step);
        position: absolute;
        left: 0;
        top: 0.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        background: var(--help-surface);
        color: var(--help-brand);
        border-radius: 6px;
        font-weight: 600;
      }

      .help__note {
        margin: 0;
        padding: 1rem 1.25rem;
        background: var(--help-surface);
        border-radius: 8px;
        color: var(--help-text-secondary);
        font-size: 0.9375rem;
      }

      .help__carousel {
        margin: 0 0 1.5rem;
      }

      .help__controls {
        display: none;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }

      .help__pause {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 1px solid var(--help-border);
        border-radius: 999px;
        color: var(--help-text-secondary);
        font-size: 0.875rem;
        cursor: pointer;
      }

      .help__pause:focus-within {
        outline: 2px solid var(--help-brand);
        outline-offset: 2px;
      }

      .help__pause-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .help__pause-input:checked ~ .help__pause-text--pause,
      .help__pause-text--play {
        display: none;
      }

      .help__pause-input:checked ~ .help__pause-text--play {
        display: inline;
      }

      .help__dots {
        display: inline-flex;
        gap: 0.5rem;
      }

      .help__dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--help-text-secondary);
        opacity: 0.3;
      }

      .help__track {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .help__slide--loop {
        display: none;
      }

      .help__shot {
        margin: 0;
        text-align: center;
      }

      /**
       * 1. Sized so a 3x device renders the 520px source at roughly 1:1 — wider
       *    and the share-sheet UI inside the screenshot goes soft.
       * 2. The raster is a light-theme capture on every surface; only the frame
       *    and the caption follow the theme. Same treatment as /install.
       */
      .help__shot-img {
        display: block;
        width: min(60%, 176px); /* 1 */
        height: auto;
        margin: 0 auto;
        border: 1px solid var(--help-border); /* 2 */
        border-radius: 10px;
      }

      .help__shot-caption {
        padding-top: 0.5rem;
        color: var(--help-text-secondary);
        font-size: 0.875rem;
      }

      /**
       * 1. `hidden` alone makes this a programmatically scrollable box whose
       *    scrollWidth is four slides wide, so VoiceOver scrolling a slide into
       *    view — or find-on-page matching the clone's caption — sets scrollLeft,
       *    which then composes with the track's translateX and desyncs the
       *    carousel for the life of the page. `clip` never becomes a scroll
       *    container. It ships in Safari 16, which is the iOS app's floor; the
       *    `hidden` above it is the cascade fallback for older desktop Safari.
       * 2. Deliberately no `transition` on the track: transition declarations
       *    outrank animation declarations, so one here fights the keyframes and
       *    sweeps the track backwards.
       */
      @media (prefers-reduced-motion: no-preference) {
        @supports selector(:has(*)) {
          .help__controls {
            display: flex;
          }

          .help__viewport {
            overflow: hidden; /* 1 */
            overflow: clip; /* 1 */
          }

          .help__track {
            display: flex;
            gap: 0;
            animation: help-carousel-track 18s infinite; /* 2 */
            animation-timing-function: ease-in-out;
          }

          .help__slide {
            flex: 0 0 100%;
          }

          .help__slide--loop {
            display: block;
          }

          .help__dot {
            animation: help-carousel-dot 18s infinite;
          }

          .help__dot--2 {
            animation-delay: 6s;
          }

          .help__dot--3 {
            animation-delay: 12s;
          }

          .help__carousel:has(.help__pause-input:checked) .help__track,
          .help__carousel:has(.help__pause-input:checked) .help__dot {
            animation-play-state: paused;
          }
        }
      }

      @keyframes help-carousel-track {
        0%, 26.667% {
          transform: translateX(0);
        }
        33.333%, 60% {
          transform: translateX(-100%);
        }
        66.667%, 93.333% {
          transform: translateX(-200%);
        }
        100% {
          transform: translateX(-300%);
        }
      }

      @keyframes help-carousel-dot {
        0%, 27% {
          opacity: 1;
        }
        33%, 100% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <main class="help">
      <h1 class="help__title" data-test-help-title>Add links with Share</h1>
      <ol class="help__steps">
        <li class="help__step" data-test-help-step>Open a link in any app.</li>
        <li class="help__step" data-test-help-step>Tap Share.</li>
        <li class="help__step" data-test-help-step>Choose Readplace.</li>
      </ol>

      <section class="help__carousel" aria-roledescription="carousel" aria-label="Readplace on iPhone" data-test-help-carousel>
        <div class="help__controls">
          <label class="help__pause">
            <input type="checkbox" class="help__pause-input" data-test-help-pause>
            <span class="help__pause-text help__pause-text--pause">Pause the screenshots</span>
            <span class="help__pause-text help__pause-text--play">Play the screenshots</span>
          </label>
          <span class="help__dots" aria-hidden="true">
            {{#each dots}}<span class="help__dot {{positionClass}}"></span>{{/each}}
          </span>
        </div>

        <div class="help__viewport">
          <ul class="help__track" role="list">
            {{#each trackSlides}}
            <li class="help__slide{{loopClass}}"{{#if ariaHidden}} aria-hidden="{{ariaHidden}}"{{/if}} data-test-help-slide>
              <figure class="help__shot">
                <img class="help__shot-img" src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" decoding="async">
                <figcaption class="help__shot-caption">{{caption}}</figcaption>
              </figure>
            </li>
            {{/each}}
          </ul>
        </div>
      </section>

      <p class="help__note" data-test-help-note>Sharing captures the full page — even on sites that block crawlers.</p>
    </main>
  </body>
</html>
