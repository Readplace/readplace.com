{{#if confirm}}
<a class="menu__item article-delete__fallback-link" href="#{{confirm.fallbackId}}" hx-boost="false" title="{{label}}" data-delete-fallback-open data-test-action="delete-fallback">{{icon "trash"}}<span>{{label}}</span></a>
<button class="menu__item article-delete__trigger" type="button" popovertarget="{{confirm.popoverId}}" title="{{label}}" aria-haspopup="dialog" data-test-action="delete">{{icon "trash"}}<span>{{label}}</span></button>
{{else}}
<form method="POST" action="{{url}}" class="article-delete__form" hx-boost="true" hx-target="main" hx-select="main" hx-swap="{{swap}}">
  <button class="menu__item" type="submit" title="{{label}}" data-test-action="delete">{{icon "trash"}}<span>{{label}}</span></button>
</form>
{{/if}}
