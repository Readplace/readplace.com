<form method="POST" action="{{url}}" class="article-delete__form{{#if confirm}} article-delete__form--fallback{{/if}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="{{swap}}">
  <button class="menu__item" type="submit" title="Delete" data-test-action="{{#if confirm}}delete-fallback{{else}}delete{{/if}}">{{icon "trash"}}<span>Delete</span></button>
</form>
{{#if confirm}}
<button class="menu__item article-delete__trigger" type="button" popovertarget="{{confirm.popoverId}}" title="Delete" aria-haspopup="dialog" data-test-action="delete">{{icon "trash"}}<span>Delete</span></button>
{{/if}}
