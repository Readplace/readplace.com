<template data-reader-skeleton data-main-class="reader" data-body-class="page-reader page-distraction-free" data-body-class-from="page-readlist">
  <style nonce="{{cspNonce}}">{{{styles}}}</style>
  <div class="reading-layout reading-layout--with-rail-card">
    <div class="reading-layout__main">
      <div class="reader__article-body" data-article-body>
        <div class="article-body__toolbar">
          <div class="article-body__actions article-body__actions--top">
            <div class="article-body__back-slot article-body__back-slot--visible">
              <a class="article-body__back" href="{{backHref}}">{{icon "arrow-left"}}<span class="article-body__action-label">{{backLabel}}</span></a>
            </div>
            <div class="article-body__readlists-slot article-body__readlists-slot--visible" inert>
              <span class="btn btn--neutral article-body__readlists-trigger">{{icon "plus"}}<span class="article-body__action-label">Add to readlist</span><span class="article-body__readlists-chevron" aria-hidden="true">{{icon "chevron-down"}}</span></span>
            </div>
            <div class="article-body__mark-read-slot article-body__mark-read-slot--visible" inert>
              <button class="btn btn--secondary article-body__mark-read" type="button" disabled><span class="article-body__action-icon article-body__mark-read-icon">{{icon "check"}}</span><span class="article-body__mark-read-label article-body__action-label">Mark as read</span></button>
            </div>
            <div class="article-body__share-slot" inert>
              <span class="btn btn--neutral btn--icon">{{icon "share"}}<span class="sr-only">Share</span></span>
            </div>
            <div class="article-body__downloads-slot article-body__downloads-slot--visible" inert>
              <span class="btn btn--neutral btn--icon">{{icon "download"}}<span class="sr-only">Download EPUB</span></span>
            </div>
          </div>
        </div>
        <article class="article-body__card article-body__card--article">
          <div class="article-body__header">
            <h1 class="article-body__title" data-reader-field-text="title"></h1>
            <div class="article-body__meta">
              <span class="article-body__fact article-body__site">{{icon "globe"}}<span class="article-body__fact-label" data-reader-field-text="site"></span></span>
              <span class="article-body__fact article-body__saved">{{icon "clock"}}<span class="article-body__fact-label" data-reader-field-text="saved" data-reader-field-empty-class="article-body__fact-label--empty"></span></span>
              <span class="article-body__fact article-body__read-time">{{icon "eye"}}<span class="article-body__fact-label" data-reader-field-text="read-time" data-reader-field-empty-class="article-body__fact-label--empty"></span></span>
              <a class="article-body__fact article-body__original" href="" target="_blank" rel="noopener" data-reader-field-href="site">{{icon "external-link"}}<span>Original</span><span class="sr-only"> article</span></a>
            </div>
          </div>
          <div class="article-body__reader-slot article-body__reader-slot--loading reader-skeleton" data-reader-status="loading" data-test-reader-skeleton>
            <div class="reader-skeleton__paragraph"><span class="reader-skeleton__line"></span><span class="reader-skeleton__line"></span><span class="reader-skeleton__line reader-skeleton__line--short"></span></div>
            <div class="reader-skeleton__paragraph"><span class="reader-skeleton__line"></span><span class="reader-skeleton__line"></span><span class="reader-skeleton__line reader-skeleton__line--short"></span></div>
            <div class="reader-skeleton__paragraph"><span class="reader-skeleton__line"></span><span class="reader-skeleton__line"></span><span class="reader-skeleton__line reader-skeleton__line--short"></span></div>
          </div>
        </article>
      </div>
    </div>
  </div>
</template>
