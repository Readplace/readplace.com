<div class="readlist__alert {{stateClass}}" role="alert" data-test-readlist-error>
  <span class="readlist__alert-icon" aria-hidden="true">{{icon "x-circle"}}</span>
  <div class="readlist__alert-text">
    <p class="readlist__alert-title" data-test-readlist-error-title>{{title}}</p>
    <p class="readlist__alert-body">{{body}}</p>
  </div>
</div>
