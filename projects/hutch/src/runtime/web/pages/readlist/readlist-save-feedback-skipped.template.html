<ul class="readlist-save-feedback__skipped-list">
  {{#each entries}}
  <li class="readlist-save-feedback__skipped-row" data-test-import-skipped-row>
    <span><span class="readlist-save-feedback__skipped-reason" data-test-import-skipped-reason>{{reasonLabel}}</span> —</span>
    <span class="readlist-save-feedback__skipped-url" data-test-import-skipped-url>{{url}}</span>
  </li>
  {{/each}}
</ul>
{{#if andMore}}<p class="readlist-save-feedback__skipped-more" data-test-import-skipped-more>And {{andMore}} more.</p>{{/if}}
