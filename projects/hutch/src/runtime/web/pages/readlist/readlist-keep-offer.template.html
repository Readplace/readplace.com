<aside class="readlist-keep-offer {{stateClass}}" data-test-keep-offer>
  {{#if isShown}}
  <h2 class="readlist-keep-offer__title">You've kept {{savesCount}} articles this week.</h2>
  <p class="readlist-keep-offer__body" data-test-keep-offer-body>Choose during your trial: {{priceClause}} Add a card now and nothing is charged until <time datetime="{{trialEnd.iso}}" data-local-time="{{trialEnd.mode}}">{{trialEnd.label}}</time>. A reminder email arrives a week before. Your saves stay readable and exportable either way.</p>
  <div class="readlist-keep-offer__actions">
    <form method="POST" action="{{track '/account/subscribe' source='keep-panel' content='keep'}}">
      <input type="hidden" name="plan" value="yearly">
      <input type="hidden" name="offer" value="{{offer}}">
      <button type="submit" class="btn btn--primary btn--m">Keep Readplace</button>
    </form>
    <form method="POST" action="{{track '/queue/keep-offer/dismiss' source='keep-panel' content='not-now'}}">
      <button type="submit" class="btn btn--secondary btn--m">Not now</button>
    </form>
  </div>
  {{/if}}
</aside>
