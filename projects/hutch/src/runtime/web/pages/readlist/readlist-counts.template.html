{{{countHtml}}}
<span class="pagination__info" id="readlist-pagination-info" data-test-pagination-info hx-swap-oob="outerHTML">{{showingLabel}}</span>
<ol class="pagination__pages" id="readlist-pages" data-test-pagination-pages hx-swap-oob="outerHTML">
  {{#each pages}}
  <li class="pagination__page-item">
    {{#if href}}<a class="pagination__page" href="{{href}}" data-test-pagination-page="{{number}}">{{number}}</a>{{else}}<span class="{{spanClass}}"{{#if isCurrent}} aria-current="page" data-test-pagination-page="{{number}}"{{/if}}>{{#if isGap}}{{icon "ellipsis"}}<span class="sr-only">{{label}}</span>{{else}}{{label}}{{/if}}</span>{{/if}}
  </li>
  {{/each}}
</ol>
