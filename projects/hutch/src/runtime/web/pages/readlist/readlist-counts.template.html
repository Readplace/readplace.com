<span id="{{unreadLabelId}}" hx-swap-oob="innerHTML">{{filterUnreadLabel}}</span>
<span class="readlist__count" id="readlist-count" data-test-listing-count hx-swap-oob="outerHTML">{{countLabel}}</span>
<span class="readlist__showing" id="readlist-pagination-info" data-test-pagination-info hx-swap-oob="outerHTML">{{showingLabel}}</span>
<ol class="readlist__pages" id="readlist-pages" data-test-pagination-pages hx-swap-oob="outerHTML">
  {{#each pages}}
  <li class="readlist__page-item">
    {{#if href}}<a class="readlist__page" href="{{href}}" data-test-pagination-page="{{number}}">{{number}}</a>{{else}}<span class="{{spanClass}}"{{#if isCurrent}} aria-current="page" data-test-pagination-page="{{number}}"{{/if}}>{{label}}</span>{{/if}}
  </li>
  {{/each}}
</ol>
