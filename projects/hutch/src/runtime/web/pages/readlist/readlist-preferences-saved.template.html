<dialog open class="confirm-popover readlist-preferences-saved" aria-labelledby="preferences-saved-title" aria-describedby="preferences-saved-body preferences-saved-limit" data-preferences-saved>
  <div class="confirm-popover__header">
    <h2 class="confirm-popover__title" id="preferences-saved-title">{{t "readlistPreferences.saved"}}</h2>
  </div>
  <p class="confirm-popover__body" id="preferences-saved-body">{{t "readlistPreferences.matching" readlist=readlist}}</p>
  <p class="confirm-popover__body" id="preferences-saved-limit">{{t "readlistPreferences.linkLimit" limit=limit}}</p>
  <form method="dialog" class="confirm-popover__buttons" hx-boost="false">
    <button class="btn btn--neutral" type="submit" autofocus>{{t "readlistPreferences.dismiss"}}</button>
  </form>
</dialog>
