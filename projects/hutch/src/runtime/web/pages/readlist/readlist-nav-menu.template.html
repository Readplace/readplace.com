{{#if isDeletable}}
<details class="menu readlist-nav__menu readlist-row__trailing" data-test-readlist-menu="{{name}}">
  <summary class="menu__toggle" data-test-action="readlist-menu">{{icon "ellipsis-vertical"}}<span class="sr-only">Options for {{title}}</span></summary>
  <div class="menu__panel">
    <button class="menu__item readlist-nav__confirm-trigger" type="button" popovertarget="{{renamePopoverId}}" aria-haspopup="dialog" data-test-action="readlist-rename">{{icon "pencil"}}<span>Edit</span></button>
    <form class="readlist-nav__rename-fallback" method="POST" action="{{renameAction}}" hx-boost="false" data-test-form="readlist-rename-fallback">
      <label class="form-field__label" for="{{renameInputId}}">{{renameLabel}}</label>
      <input class="form-input" id="{{renameInputId}}" type="text" name="{{renameField}}" value="{{title}}" maxlength="{{renameMaxLength}}" required autocomplete="off" data-test-readlist-rename-fallback-input>
      <button class="btn btn--primary" type="submit" data-test-action="readlist-rename-fallback">Save</button>
    </form>
    {{#each pinForms}}
    <form class="readlist-nav__pin-form" method="POST" action="{{action}}" data-test-form="{{key}}">
      <button class="menu__item" type="submit" data-test-action="{{key}}">{{icon iconName}}<span>{{label}}</span></button>
    </form>
    {{/each}}
    <button class="menu__item readlist-nav__confirm-trigger" type="button" popovertarget="{{deletePopoverId}}" aria-haspopup="dialog" data-test-action="readlist-delete">{{icon "trash"}}<span>Delete</span></button>
    <form class="readlist-nav__delete-fallback" method="POST" action="{{deleteAction}}" hx-boost="false">
      <button class="menu__item" type="submit" data-test-action="readlist-delete-fallback">{{icon "trash"}}<span>Delete</span></button>
    </form>
  </div>
</details>
{{/if}}
{{#each lockedMenus}}
<details class="menu readlist-nav__menu readlist-row__trailing" data-test-readlist-menu="{{name}}" data-test-menu-standing="locked">
  <summary class="menu__toggle" data-test-action="readlist-menu">{{icon "ellipsis-vertical"}}<span class="sr-only">Options for {{title}}</span></summary>
  <div class="menu__panel">
    {{#each menuLocks}}
    {{{this}}}
    {{/each}}
  </div>
</details>
{{/each}}
