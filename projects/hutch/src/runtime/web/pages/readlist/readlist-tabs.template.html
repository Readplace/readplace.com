<nav class="underline-tabs" aria-label="Article filters" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-indicator="closest .underline-tabs, closest .underline-tabs__tab, .readlist-listing" data-test-filters>
  {{#each tabs}}
  <a class="underline-tabs__tab" href="{{href}}"{{#if isActive}} aria-current="page"{{/if}} data-test-filter="{{testFilter}}"><span class="underline-tabs__label" data-widest="{{widestLabel}}"><span>{{label}}</span></span>{{#if beta}}<span class="chip chip--badge chip--accent" data-test-filter-beta>Beta</span>{{/if}}</a>
  {{/each}}
</nav>
