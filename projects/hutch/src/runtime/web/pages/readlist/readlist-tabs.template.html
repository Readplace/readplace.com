<nav class="readlist-tabs" aria-label="Article filters" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" hx-indicator="closest .readlist-tabs, closest .readlist-tabs__link, .readlist-listing" data-test-filters>
  {{#each tabs}}
  <a class="{{linkClass}}" href="{{href}}"{{#if isActive}} aria-current="page"{{/if}} data-test-filter="{{testFilter}}"><span class="readlist-tabs__label" data-widest="{{widestLabel}}"><span{{#if labelId}} id="{{labelId}}" hx-preserve{{/if}}>{{label}}</span></span></a>
  {{/each}}
</nav>
