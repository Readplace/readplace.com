<nav class="readlist-nav" aria-label="Readlists" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-readlist-nav>
  <h2 class="readlist-nav__title">Readlists</h2>
  <ul class="readlist-nav__list">
    {{#each items}}
    <li class="{{itemClass}}">
      <a class="{{linkClass}}" href="{{href}}"{{#if isActive}} aria-current="page"{{/if}} data-test-readlist="{{name}}">{{icon iconName}}<span class="readlist-nav__label">{{title}}</span></a>
      {{#if isDeletable}}
      <details class="readlist-nav__menu" data-test-readlist-menu="{{name}}">
        <summary class="readlist-nav__menu-toggle" aria-label="Options for {{title}}" data-test-action="readlist-menu">{{icon "ellipsis-vertical"}}</summary>
        <div class="readlist-nav__menu-panel">
          <button class="readlist-nav__menu-item" type="button" popovertarget="{{renamePopoverId}}" aria-haspopup="dialog" data-test-action="readlist-rename">{{icon "pencil"}}<span>Edit</span></button>
          <button class="readlist-nav__menu-item readlist-nav__menu-item--danger readlist-nav__confirm-trigger" type="button" popovertarget="{{deletePopoverId}}" aria-haspopup="dialog" data-test-action="readlist-delete">{{icon "trash"}}<span>Delete</span></button>
          <form class="readlist-nav__delete-fallback" method="POST" action="{{deleteAction}}" hx-boost="false">
            <button class="readlist-nav__menu-item readlist-nav__menu-item--danger" type="submit" data-test-action="readlist-delete-fallback">{{icon "trash"}}<span>Delete</span></button>
          </form>
        </div>
      </details>
      {{/if}}
    </li>
    {{/each}}
  </ul>
  {{#if canCreate}}
  <form class="readlist-nav__new-form" method="POST" action="{{newReadlistAction}}">
    <button class="readlist-nav__new" type="submit" data-test-action="new-readlist">{{icon "plus"}}<span>Create a readlist</span></button>
  </form>
  {{/if}}
</nav>
