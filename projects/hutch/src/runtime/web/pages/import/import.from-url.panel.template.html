{{#if errorMessage}}
          {{{errorAlertHtml}}}
          {{/if}}
          <form class="import__from-url-form import__panel" method="POST" action="{{fromUrlAction}}"
            data-save-tip="{{saveTipState}}"
            data-test-form="import-from-url"
            hx-post="{{fromUrlAction}}" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
            <div class="import__panel-heading">
              <h2 class="import__panel-title"><label for="import-from-url-input">Import from a link</label></h2>
              <p class="import__panel-description" id="import-from-url-description">Paste a newsletter or index page link, and Readplace finds all the links for you to review.</p>
            </div>
            <div class="import__from-url-row">
              <input id="import-from-url-input"
                class="form-input import__from-url-input"
                type="url"
                name="url"
                required
                inputmode="url"
                autocomplete="off"
                spellcheck="false"
                placeholder="https://newsletter.example/issue-42"
                value="{{prefillUrl}}"
                aria-describedby="import-from-url-description import-from-url-meta"
                data-test-import-from-url-input>
              <button class="btn btn--primary import__from-url-btn" type="submit" data-test-action="import-from-url-submit">Fetch link</button>
            </div>
            <p class="import__from-url-meta" id="import-from-url-meta">Readplace will load the page and list every outbound link.</p>
          </form>
          {{{saveTipHtml}}}
