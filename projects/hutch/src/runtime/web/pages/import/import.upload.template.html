{{#if errorMessage}}
          {{{errorAlertHtml}}}
          {{/if}}
          <form class="import__upload-form import__panel" method="POST" action="{{uploadAction}}" enctype="multipart/form-data"
            data-import-state="idle" data-test-form="import-file"
            hx-post="{{uploadAction}}" hx-encoding="multipart/form-data"
            hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
            <div class="import__panel-heading">
              <h2 class="import__panel-title">Upload a file</h2>
              <p class="import__panel-description">Upload a file containing links, and Readplace extracts them for you to review before saving.</p>
            </div>
            <div class="import__idle" data-import-region="idle">
              <label class="import__dropzone" data-import-dropzone>
                <input type="file" name="file" required class="import__file-input" data-test-import-file-input>
                <span class="import__dropzone-icon" aria-hidden="true">{{icon "upload"}}</span>
                <span class="import__dropzone-text">
                  <span class="import__dropzone-primary">Choose a file or drag it here</span>
                  <span class="import__dropzone-meta" data-import-dropzone-meta>HTML, JSON, or plain text &middot; Max <span class="import__dropzone-size">{{limits.maxFileSize}}</span> &middot; Up to {{limits.maxLinks}} links</span>
                </span>
              </label>
              <button class="btn btn--primary import__upload-btn" type="submit" data-test-action="import-upload">Upload</button>
            </div>
            <div class="import__uploading" data-import-region="uploading" aria-live="polite">
              <div class="import__progress-bar" data-import-progress-bar>
                <div class="import__progress-fill" data-import-progress-fill style="width: 0%"></div>
              </div>
              <p class="import__progress-label" data-import-progress-label>Preparing upload&hellip;</p>
            </div>
          </form>
