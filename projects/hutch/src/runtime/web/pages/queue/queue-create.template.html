<section class="queue-create" data-test-queue-create>
            <h2 class="queue-create__title">New queue</h2>
            {{#if error}}<p class="queue-create__error" role="alert" data-test-queue-create-error>{{error}}</p>{{/if}}
            <form class="queue-create__form" method="POST" action="{{action}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none">
              <label class="sr-only" for="queue-create-label">Queue name</label>
              <input class="queue-create__input" id="queue-create-label" type="text" name="label" maxlength="{{maxLength}}" placeholder="e.g. Work reading" required autocomplete="off" autofocus value="{{submittedLabel}}"{{#if error}} aria-invalid="true"{{/if}}>
              <button class="btn btn--primary btn--field queue-create__submit" type="submit" data-test-action="create-queue">Create</button>
            </form>
            <a class="queue-create__cancel" href="{{cancelUrl}}" data-test-action="cancel-create-queue">Cancel</a>
          </section>
