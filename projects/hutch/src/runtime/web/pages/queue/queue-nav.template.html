<nav class="queue-nav" aria-label="Queues" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-queue-nav>
          <ul class="queue-nav__list">
            {{#each items}}
            <li class="queue-nav__item">
              <a class="queue-nav__link" href="{{href}}" aria-current="page" data-test-queue="{{name}}">{{title}}</a>
            </li>
            {{/each}}
          </ul>
          <button class="queue-nav__new" type="button" data-test-action="new-queue">{{icon "plus"}}<span class="sr-only">New queue</span></button>
        </nav>
