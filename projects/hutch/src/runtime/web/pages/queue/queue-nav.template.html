<nav class="queue-nav" aria-label="Queues" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-queue-nav>
          <ul class="queue-nav__list">
            {{#each items}}
            <li class="queue-nav__item{{#if isDeletable}} queue-nav__item--deletable{{/if}}">
              <a class="{{linkClass}}" href="{{href}}"{{#if isActive}} aria-current="page"{{/if}}{{#if isRenameable}} hx-boost="false" aria-label="Rename {{title}}" data-queue-rename="{{renameAction}}" data-queue-rename-field="{{renameField}}" data-queue-label-max="{{maxLength}}"{{/if}} data-test-queue="{{name}}"><span class="queue-nav__label">{{title}}</span>{{#if isRenameable}}{{icon "pencil"}}{{/if}}</a>
              {{#if isDeletable}}
              <form class="queue-nav__delete-fallback" method="POST" action="{{deleteAction}}" hx-boost="false">
                <button class="queue-nav__delete" type="submit" title="Delete queue" data-test-action="queue-delete-fallback">{{icon "x"}}<span class="sr-only">Delete {{title}}</span></button>
              </form>
              <button class="queue-nav__delete queue-nav__confirm-trigger" type="button" popovertarget="{{deletePopoverId}}" title="Delete queue" aria-haspopup="dialog" data-test-action="queue-delete">{{icon "x"}}<span class="sr-only">Delete {{title}}</span></button>
              {{/if}}
            </li>
            {{/each}}
          </ul>
          {{#if canCreate}}
          <form class="queue-nav__new-form" method="POST" action="{{newQueueAction}}">
            <button class="queue-nav__new" type="submit" data-test-action="new-queue">{{icon "plus"}}<span class="sr-only">New queue</span></button>
          </form>
          {{/if}}
        </nav>
