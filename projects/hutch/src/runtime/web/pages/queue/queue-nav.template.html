<nav class="queue-nav" aria-label="Queues" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none" data-test-queue-nav>
          <ul class="queue-nav__list">
            {{#each items}}
            <li class="queue-nav__item">
              <a class="{{linkClass}}" href="{{href}}"{{#if isActive}} aria-current="page"{{/if}} data-test-queue="{{name}}">{{title}}</a>
            </li>
            {{/each}}
          </ul>
          {{#if canCreate}}
          <a class="queue-nav__new" href="{{newQueueHref}}" data-test-action="new-queue">{{icon "plus"}}<span class="sr-only">New queue</span></a>
          {{/if}}
        </nav>
