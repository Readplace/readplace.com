<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your first email landed in your Readplace inbox</title>
  </head>
  <body style="margin:0;padding:0;background-color:{{colors.background}};font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:{{colors.background}};padding:40px 20px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:{{colors.surface}};border-radius:8px;padding:40px;">
            <tr>
              <td align="center" style="padding-bottom:16px;">
                <img src="{{founderAvatarUrl}}" width="64" height="64" alt="Fayner Brack" style="border-radius:50%;display:block;">
              </td>
            </tr>
            <tr>
              <td>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:{{colors.body}};">{{opening.before}}<span style="white-space:nowrap;font-weight:700;">{{opening.address}}</span>{{opening.after}}</p>
                {{#each paragraphs}}
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:{{../colors.body}};">{{{this}}}</p>
                {{/each}}
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:6px;background-color:{{colors.brand}};">
                      <a href="{{ctaUrl}}" style="display:inline-block;padding:12px 24px;font-size:16px;color:{{colors.brandText}};text-decoration:none;border-radius:6px;">{{ctaLabel}}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:16px;line-height:1.6;color:{{colors.body}};">{{replyLine}}</p>
                <p style="margin:32px 0 0;font-size:16px;line-height:1.6;color:{{colors.body}};">{{{signoff}}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
