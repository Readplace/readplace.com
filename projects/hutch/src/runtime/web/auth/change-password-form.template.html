<form class="auth-form" method="POST" action="{{formAction}}" hx-post="{{formAction}}" hx-target="this" hx-swap="outerHTML show:none" hx-sync="closest .auth-card:drop" hx-disabled-elt="find button" data-test-form="change-password">
          <input type="email" name="username" value="{{email}}" autocomplete="username" readonly hidden>
          <div class="form-field">
            <label class="form-field__label" for="currentPassword">Current password</label>
            <input class="form-input" type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password"{{#if currentPasswordField.error}} aria-invalid="true" aria-describedby="currentPassword-error"{{/if}}{{#if currentPasswordField.autofocus}} autofocus{{/if}}>
            {{#if currentPasswordField.error}}<p class="form-field__error" id="currentPassword-error" role="alert" data-test-error="currentPassword">{{currentPasswordField.error}}</p>{{/if}}
          </div>
          <div class="form-field">
            <label class="form-field__label" for="password">New password</label>
            <input class="form-input" type="password" id="password" name="password" required autocomplete="new-password" minlength="8"{{#if passwordField.error}} aria-invalid="true" aria-describedby="password-error"{{/if}}{{#if passwordField.autofocus}} autofocus{{/if}}>
            {{#if passwordField.error}}<p class="form-field__error" id="password-error" role="alert" data-test-error="password">{{passwordField.error}}</p>{{/if}}
          </div>
          <div class="form-field">
            <label class="form-field__label" for="confirmPassword">Confirm new password</label>
            <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password"{{#if confirmPasswordField.error}} aria-invalid="true" aria-describedby="confirmPassword-error"{{/if}}{{#if confirmPasswordField.autofocus}} autofocus{{/if}}>
            {{#if confirmPasswordField.error}}<p class="form-field__error" id="confirmPassword-error" role="alert" data-test-error="confirmPassword">{{confirmPasswordField.error}}</p>{{/if}}
          </div>
          <button class="btn btn--primary auth-form__submit" type="submit" data-test-action="change-password"><span class="auth-form__submit-label">Change password</span>{{{loaderHtml}}}</button>
        </form>
