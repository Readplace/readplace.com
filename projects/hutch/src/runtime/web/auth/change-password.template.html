    <main class="auth-page">
      <div class="auth-card" id="change-password-card">
        <h1 class="auth-card__title">Change your password</h1>
        <p class="auth-card__subtitle">Changing it signs you out of the website in every other browser.</p>
        {{{formHtml}}}
        <p class="auth-card__footer auth-card__footer--forgot">
          <a class="auth-card__link" href="{{forgotHref}}">Forgot your current password?</a>
        </p>
        <p class="auth-card__footer" data-test-back-to-account>
          <a class="auth-card__link" href="{{backHref}}" hx-boost="true" hx-target="main" hx-select="main" hx-swap="outerHTML show:none scroll:html:top">Back to account</a>
        </p>
      </div>
    </main>
