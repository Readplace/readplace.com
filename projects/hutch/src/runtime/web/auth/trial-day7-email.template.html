<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
      @media (min-width: 768px) {
        .email-card__body {
          padding: 40px !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:{{colors.muted}};font-family:{{fontStack}};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:{{colors.muted}};padding:40px 20px;font-family:{{fontStack}};table-layout:fixed;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:100%;background-color:{{colors.card}};border:1px solid {{colors.border}};border-radius:12px;">
            <tr>
              <td class="email-card__body" style="padding:24px;">
                <h1 style="margin:0 0 16px;font-size:24px;font-weight:600;line-height:1.3;color:{{colors.foreground}};">{{subject}}</h1>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:{{colors.mutedForeground}};">{{intro}}</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:{{colors.mutedForeground}};">{{waitingLine}}</p>
                <ul style="margin:0 0 16px;padding:0 0 0 20px;font-size:16px;line-height:1.6;color:{{colors.mutedForeground}};">
                  {{#each items}}
                  <li style="margin:0 0 8px;"><a href="{{url}}" style="color:{{../colors.primaryText}};text-decoration:underline;">{{title}}</a> — {{siteName}}</li>
                  {{/each}}
                </ul>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                  <tr>
                    <td style="border-radius:6px;background-color:{{colors.card}};border:1px solid {{colors.border}};">
                      <a href="{{continueUrl}}" style="display:inline-block;padding:12px 24px;font-size:16px;font-weight:600;line-height:20px;color:{{colors.foreground}};text-decoration:none;border-radius:6px;">{{continueLabel}}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:{{colors.mutedForeground}};">{{pricing}}</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:6px;background-color:{{colors.primary}};">
                      <a href="{{keepUrl}}" style="display:inline-block;padding:12px 24px;font-size:16px;font-weight:600;line-height:20px;color:{{colors.primaryForeground}};text-decoration:none;border-radius:6px;">{{keepLabel}}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:16px;line-height:1.6;color:{{colors.mutedForeground}};">{{signoff}}</p>
                <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:{{colors.mutedForeground}};">{{footerReason}} <a href="{{unsubscribeUrl}}" style="color:{{colors.primaryText}};text-decoration:underline;">{{unsubscribeLabel}}</a> · Proficient Pty Ltd, {{postalAddress}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
