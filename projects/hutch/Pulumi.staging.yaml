config:
  aws:region: ap-southeast-2
  aws:allowedAccountIds:
    - '572337278115'
  hutch:stage: staging
  hutch:nodeEnv: development
  hutch:platformStack: organization/platform/staging
  hutch:domains:
    - readplace-staging.com
  hutch:redirectSubdomains:
    - host: www.readplace-staging.com
      zoneName: readplace-staging.com
  hutch:ssrCdn:
    domain: readplace-staging.com
    dnsTarget: cloudfront
  hutch:deletionProtection: false
  hutch:staticDomains:
    - static.readplace-staging.com
  hutch:staticBucketName: hutch-static-assets-staging
  hutch:dynamodbArticlesTable: hutch-articles-cda0a08
  hutch:dynamodbUserArticlesTable: hutch-user-articles-8226beb
  hutch:dynamodbUsersTable: hutch-users-f90c09e
  hutch:dynamodbReaderReadyNotificationsTable: hutch-reader-ready-notifications-staging
  hutch:dynamodbSessionsTable: hutch-sessions-d17dbb3
  hutch:dynamodbOauthTable: hutch-oauth-ecd3db9
  hutch:dynamodbVerificationTokensTable: hutch-verification-tokens-3f85043
  hutch:dynamodbPasswordResetTokensTable: hutch-password-reset-tokens
  hutch:dynamodbPendingSignupsTable: hutch-pending-signups
  hutch:dynamodbImportSessionsTable: hutch-import-sessions-staging
  hutch:dynamodbInboxAddressesTable: hutch-inbox-addresses-staging
  hutch:dynamodbInboxEmailsTable: hutch-inbox-emails-staging
  hutch:dynamodbInboxEmailLinksTable: hutch-inbox-email-links-staging
  hutch:dynamodbInboxSavedLinksTable: hutch-inbox-saved-links-staging
  hutch:dynamodbSubscriptionProvidersTable: hutch-subscription-providers-staging
  hutch:dynamodbOnboardingTable: hutch-onboarding-staging
  hutch:dynamodbRateLimitsTable: hutch-rate-limits-staging
  hutch:dynamodbDigestQueueTable: hutch-digest-queue-staging
  hutch:dynamodbGmailCredentialsTable: hutch-gmail-credentials-staging
  hutch:dynamodbGmailConnectionsTable: hutch-gmail-connections-staging
  hutch:dynamodbGmailSendersTable: hutch-inbox-gmail-senders-staging
  hutch:rateLimitViewCrawl: 10000/3600
  hutch:rateLimitLogin: 5000/900
  hutch:rateLimitLoginAccount: 5000/900
  hutch:rateLimitSignup: 5000/3600
  hutch:rateLimitForgotPassword: 5000/3600
  hutch:rateLimitOauthRegister: 5000/3600
  hutch:rateLimitOauthToken: 5000/3600
  hutch:rateLimitImport: 5000/3600
  hutch:rateLimitImportFromUrl: 5000/3600
  hutch:apiThrottleBurstLimit: 5000
  hutch:apiThrottleRateLimit: 2000
  hutch:trialSchedulerGroupName: hutch-trial-end-staging
  hutch:contentBucketName: hutch-article-content-staging
  hutch:contentMediaCdnDomain: cdn.readplace-staging.com
  hutch:pendingHtmlBucketName: hutch-pending-html-staging
  hutch:pendingPdfBucketName: hutch-pending-pdf-staging
  hutch:userExportBucketName: hutch-user-exports-staging
  hutch:inboxAddressDomain: readplace-staging.com
  hutch:rawEmailBucketName: hutch-inbox-raw-email-staging
  hutch:alertEmail: readplace+staging@readplace.com
  hutch:gmailConnectionCapWarnThreshold: 5
  hutch:oauthRefreshRefusedDailyThreshold: 5
  # Test rig for the outbound-mail-auth component on staging's own zone.
  # readplace-staging.com has no Google Workspace, so the SPF value is inert for
  # real deliverability here — this exists only to exercise the Pulumi record end
  # to end before prod. Deploy it in isolation with a --target'd `pulumi up`.
  hutch:googleWorkspaceMail:
    domain: readplace-staging.com
    apexTxt:
      - v=spf1 include:_spf.google.com ~all
    # Prod's readplace.com key: inert for deliverability on this zone (nothing
    # signs as readplace-staging.com) — published only to exercise the DKIM
    # record path of this rig.
    dkimRecord: "v=DKIM1; k=rsa; "
  hutch:foundingMemberLimit: '5'
  hutch:excludedVisitorIds: []
  hutch:excludedUserIds: []
